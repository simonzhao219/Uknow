# develop 環境的示範資料樹——**不是測試資料，是給人看的種子資料**。
#
# 與 orgchart.yaml 的差別只有用途與形狀：
#   orgchart.yaml           六代 30 人，為「驗規則」而設計（每代人數卡在
#                           推薦王門檻、第 4 代刻意讓 root 拿不到獎勵），
#                           跑完即刪。
#   orgchart-develop-seed   本檔，為「有東西可看」而設計：root 底下三代
#                           44 人，跑完**留著**（JOURNEY_KEEP_DATA=1）。
#
# 形狀（人審指定，2026-07-25）：第 1 代 32 人、第 2 代 8 人、第 3 代 4 人。
# 掛法：第 2 代平均掛在前 8 位第 1 代之下，第 3 代平均掛在前 4 位第 2 代之下
# ——刻意讓「有下線的」與「沒下線的」兩種會員同時存在，畫面上才看得出
# 獎勵明細的差異（B9–B32 帳上永遠 0P，是對照組）。
#
# value = 推薦人節點（null = root，沒有上線）。

nodes:
  A0: null

  # 第 1 代：32 人直推 root。遠超推薦王門檻 8，會產生多張免費續約券
  # （見 migration 0724000002 的 multi-credit）——這是刻意的，好讓
  # develop 上看得到「任務免費續約」那條路徑的資料。
  B1: A0
  B2: A0
  B3: A0
  B4: A0
  B5: A0
  B6: A0
  B7: A0
  B8: A0
  B9: A0
  B10: A0
  B11: A0
  B12: A0
  B13: A0
  B14: A0
  B15: A0
  B16: A0
  B17: A0
  B18: A0
  B19: A0
  B20: A0
  B21: A0
  B22: A0
  B23: A0
  B24: A0
  B25: A0
  B26: A0
  B27: A0
  B28: A0
  B29: A0
  B30: A0
  B31: A0
  B32: A0

  # 第 2 代：8 人，一人掛一位 B1–B8
  C1: B1
  C2: B2
  C3: B3
  C4: B4
  C5: B5
  C6: B6
  C7: B7
  C8: B8

  # 第 3 代：4 人，一人掛一位 C1–C4
  D1: C1
  D2: C2
  D3: C3
  D4: C4

# 每代 100P、三代制、一次發清（reward_config 現值）之下的預期帳本。
# 推導方式與 orgchart.yaml 相同：每個節點付款時往上發三代，各 100P。
#   B 付款（32 筆）→ 只有 A0 收得到          → 3,200P
#   C 付款（8 筆） → B_i 與 A0 各收          → 1,600P
#   D 付款（4 筆） → C_i、B_i、A0 各收       → 1,200P
# 全樹共發出 6,000P。
expected_rewards:
  A0: 4400   # 32 + 8 + 4 = 44 位三代內下線，各 100P
  # B1–B4：各有一位 C（第 1 代）與一位 D（第 2 代）
  B1: 200
  B2: 200
  B3: 200
  B4: 200
  # B5–B8：只有一位 C
  B5: 100
  B6: 100
  B7: 100
  B8: 100
  # B9–B32 無下線，帳上 0P——對照組，不逐一列出（expected_reward_count
  # 由樹形算得出來，這張表只是給人對照用的說明）。
  # C1–C4：各有一位 D
  C1: 100
  C2: 100
  C3: 100
  C4: 100
