name: Notify
description: 把告警推到 LINE（最小版；Email 留第 2 波）。缺 Secrets 時 no-op；LINE 回非 200 則讓 step 失敗，由呼叫端決定要不要吞。

# ============================================================================
# 失敗語意：
# - 缺 Secrets：no-op＋step summary（exit 0）。「沒設定」是組態狀態，不是推送失敗。
# - LINE 回非 200／連線失敗：印出狀態碼與回應前 200 字（不印 token）並 exit 1。
#   以前這裡 exit 0，於是「以上次成功 run 為窗口」的呼叫端（reconcile-payments
#   的 system_alerts 掃描）會把窗口前移、該輪告警永久遺失（2026-10-27 LINE token
#   貼錯期間就是這樣）。
# - 要不要因此變紅由呼叫端決定：失敗路徑上的通知（deploy-smoke／deploy-supabase
#   ／對帳失敗通知）本來就在報另一個紅燈，加 continue-on-error 避免蓋掉原故障
#   訊號；以窗口為起點的通知則不得加，讓 run 失敗、下一輪窗口不前移而重送。
#
# composite action 讀不到 secrets 上下文，所以憑證由呼叫端以 input 傳入。
# 訊息不得含個資：呼叫端只傳環境／來源／run 連結／告警 id 這類識別資訊，
# 不傳 email、姓名、訂單金額；本 action 另把 body 截到 200 字元。
# ============================================================================
inputs:
  level:
    description: 'P1（正式站／錢）或 P2（develop／可延後）'
    required: true
  title:
    description: '一行標題，必須標明環境'
    required: true
  body:
    description: '補充說明（不得含個資）'
    required: false
    default: ''
  run_url:
    description: '出事的 workflow run 連結'
    required: false
    default: ''
  line_channel_token:
    description: 'LINE Messaging API channel access token（secrets.LINE_CHANNEL_TOKEN）'
    required: false
    default: ''
  line_to:
    description: '收件人 LINE userId（secrets.LINE_ALERT_TO）'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: 推送 LINE 告警
      shell: bash
      env:
        N_LEVEL: ${{ inputs.level }}
        N_TITLE: ${{ inputs.title }}
        N_BODY: ${{ inputs.body }}
        N_RUN_URL: ${{ inputs.run_url }}
        N_TOKEN: ${{ inputs.line_channel_token }}
        N_TO: ${{ inputs.line_to }}
      run: |
        set -uo pipefail
        if [ -z "$N_TOKEN" ] || [ -z "$N_TO" ]; then
          echo "::warning::LINE_CHANNEL_TOKEN／LINE_ALERT_TO 未設定，告警沒有送出：[$N_LEVEL] $N_TITLE"
          {
            echo "### ⚠️ 告警未送出"
            echo ""
            echo "repository secrets \`LINE_CHANNEL_TOKEN\` 與 \`LINE_ALERT_TO\` 未設定，notify 為 no-op。"
            echo "- [$N_LEVEL] $N_TITLE"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        payload="$(python3 -c '
        import json, os
        e = os.environ
        lines = ["[%s] %s" % (e["N_LEVEL"], e["N_TITLE"])]
        if e["N_BODY"]:
            lines.append(e["N_BODY"][:200])
        if e["N_RUN_URL"]:
            lines.append(e["N_RUN_URL"])
        print(json.dumps({"to": e["N_TO"], "messages": [{"type": "text", "text": "\n".join(lines)[:1000]}]}))
        ')"
        code="$(curl -sS -o /tmp/line-resp.txt -w '%{http_code}' --max-time 20 \
          -X POST https://api.line.me/v2/bot/message/push \
          -H "Authorization: Bearer $N_TOKEN" \
          -H 'Content-Type: application/json' \
          -d "$payload" || echo 000)"
        if [ "$code" = "200" ]; then
          echo "LINE 告警已送出：[$N_LEVEL] $N_TITLE" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          # 只印狀態碼與回應前 200 字；token 只在 Authorization header，不會出現在這裡。
          resp="$(head -c 200 /tmp/line-resp.txt 2>/dev/null)"
          echo "::error::LINE 推送失敗（HTTP $code，000＝連線失敗）：$resp"
          {
            echo "### ❌ LINE 推送失敗（HTTP $code）"
            echo ""
            echo "- [$N_LEVEL] $N_TITLE"
            echo "- 回應：\`$resp\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
