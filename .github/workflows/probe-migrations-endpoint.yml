name: Probe Migrations Endpoint

# 暫時性探針（第 6 波 S6，合併前刪除）：以 develop 的 project ref 實打一次 Management API
# `GET /v1/projects/{ref}/database/migrations`，印出回應形狀（型別、筆數、元素鍵），驗證
# scripts/check-remote-migrations.py 對回應形狀的假設。主 session 要求：合併前以真實回應驗過，
# 不靠文件猜。只讀、不印 token。

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/probe-migrations-endpoint.yml
      - scripts/check-remote-migrations.py

jobs:
  migrations-endpoint-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 印出 database/migrations 回應形狀
        run: |
          set -uo pipefail
          ref="$(python3 -c "import re; print(re.search(r'projectId:\s*[\'\"]([a-z0-9]+)[\'\"]', open('config/supabaseTarget.ts').read()).group(1))")"
          python3 - "$ref" <<'PY'
          import json, os, sys, urllib.request, urllib.error
          ref = sys.argv[1]
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/migrations",
              headers={"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("HTTP", r.status)
                  body = json.loads(r.read())
          except urllib.error.HTTPError as e:
              print("HTTP", e.code); sys.exit(0)
          print("type:", type(body).__name__)
          if isinstance(body, list):
              print("count:", len(body))
              if body:
                  print("keys:", sorted(body[0].keys()))
                  print("first:", {k: (type(v).__name__, v) for k, v in body[0].items() if k != "statements"})
                  print("last version:", repr(body[-1].get("version")))
          elif isinstance(body, dict):
              print("keys:", sorted(body.keys()))
          PY

      - name: 以真實回應跑確認腳本（develop 尚缺本 PR 新增的 migration，退出碼 1 屬預期）
        run: |
          ref="$(python3 -c "import re; print(re.search(r'projectId:\s*[\'\"]([a-z0-9]+)[\'\"]', open('config/supabaseTarget.ts').read()).group(1))")"
          python3 scripts/check-remote-migrations.py --project-ref "$ref" --max-wait 0 \
            && echo "退出碼：0" || echo "退出碼：$?"
