name: Reconcile Pending Payments

# ============================================================================
# 對 PayUni webhook 沒送達、卡在 pending 太久的訂單做對帳。
#
# 這是**錢的安全網**：使用者刷卡成功但通知沒送達時，訂單會永遠停在
# pending＝付了錢進不了會員中心。queryPayUniTradeStatus 已實作、
# reconcile-pending-payments / reconcile-expire 兩支 Deno 測試也在 CI 每次
# 跑——唯獨排程從寫下來到 2026-07 都還註解著，等於這道安全網線上沒開。
#
# 開啟排程時採用的是「讓假綠不可能」而不是「再驗一次才敢開」：
#   - curl -f：HTTP 錯誤直接失敗
#   - 回應形狀斷言：HTTP 200 但 body 是錯誤內容也要紅
#   - 失敗自動開 issue：排程失敗的通知只寄給最後改檔的人，很容易蒸發
# pg-cron-schedulers（第 5 波 S1）起，**對帳由 Supabase pg_cron 觸發**（每小時第 7 分，
# migration 20261112000001）。這支 workflow 改當**看門狗兼後備觸發**：
#   - 每小時讀 GET /internal/scheduler-health，判斷 pg_cron 是否存活
#     （決策在 scripts/scheduler-watchdog.py，表格案例由 framework-check 跑）
#   - pg_cron 停擺、排程不見、人為停用、或 Edge 尚未部署（404）時自己補跑對帳
#   - 停擺時推 LINE（6 小時節流）；system_alerts 的 error 照舊推 LINE
#   - workflow_dispatch：一律直接對帳（手動觸發）
# 頻率依據：每小時。延遲直接影響付了錢的使用者，所以後備觸發要跟 pg_cron 同頻；
# 成本落在 GitHub 牆鐘（public repo 標準 runner 免費）、補跑時的 PayUni 查詢、
# 以及 LINE 訊號疲勞（停擺告警 6 小時節流、人為停用每日一則）。排程取第 37 分：
# 與 pg_cron 的第 7 分相差半小時，看門狗執行時最近一輪 pg_cron 已結束約 30 分鐘。
# ⚠️ GitHub 排程在整點高峰會丟棄觸發（152 次實測間隔中位數 1.7h、最大 6.3h）——
# 這正是改用 pg_cron 的原因；看門狗被跳過只會延後告警，不再延後對帳。
# ============================================================================
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch: {}

concurrency:
  group: reconcile-payments
  cancel-in-progress: false

# ⚠️ 刻意不設 workflow 層 permissions:底下的 job 需要 issues: write
# (失敗時開 triage issue)。權限一律逐 job 宣告,語意最清楚。

jobs:
  reconcile-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read   # 告警掃描要查上一次成功 run 的時間(workflow runs API)
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      # ref 的單一真相在 git（deploy-supabase.yml 已是這個做法），儀表板的
      # vars 只是可選覆蓋。這一步把「兩者必須一致」變成硬條件。
      #
      # 擋的不是「vars 沒設」——那會讓 URL 變成 https://.supabase.co/... ，
      # curl -f 失敗、開 issue，本來就會叫。擋的是**靜默失效**：vars 被設成
      # develop 分支的 ref 時，這支排程會去對 develop 的帳，端點照樣回
      # 200 success、契約欄位齊全、issue 不會開，而正式站卡在 pending 的
      # 訂單永遠沒人撿。付了錢的人停在「處理中」，沒有任何訊號。
      - name: 確認對帳目標是正式專案
        env:
          REF_FROM_VARS: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          ref_from_git="$(python3 -c "import re,sys; print(re.search(r'projectId\s*=\s*[\'\"]([a-z0-9]+)[\'\"]', open('src/utils/supabase/info.tsx').read()).group(1))")"
          if [ -z "$REF_FROM_VARS" ]; then
            echo "::error::repository variable SUPABASE_PROJECT_REF 未設定。"
            echo "::error::正式專案的 ref 是 $ref_from_git（來源：src/utils/supabase/info.tsx）。"
            exit 1
          fi
          if [ "$REF_FROM_VARS" != "$ref_from_git" ]; then
            echo "::error::對帳目標與 git 記載的正式專案不符——中止，不對任何帳。"
            echo "::error::  vars.SUPABASE_PROJECT_REF = $REF_FROM_VARS"
            echo "::error::  src/utils/supabase/info.tsx = $ref_from_git"
            echo "::error::若正式專案真的換了 ref，先更新 info.tsx（它同時是前端建置的來源）。"
            exit 1
          fi
          echo "對帳目標：$ref_from_git（vars 與 git 一致）"

      # pg_cron 是否存活：讀 scheduler-health，交給 scheduler-watchdog.py 決定要不要補跑、
      # 要不要推 LINE（判準 R1～R6 與 6 小時節流見該檔 docstring）。這一步自己不會紅：
      # 查不到狀態（404、5xx、連線失敗）時，決策就是「補跑」。
      - name: 看門狗判讀 pg_cron 對帳狀態
        id: watchdog
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASE: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
        run: |
          set -uo pipefail
          prev="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-payments.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)"
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 \
            "$API_BASE/internal/scheduler-health" -H "x-internal-secret: $RECONCILE_SECRET" || echo 000)"
          code="$(printf '%s' "$code" | tail -c 3)"
          # 腳本本身壞掉時保底補跑：這一步若紅，後面的補跑會被跳過，看門狗就成了靜默失效。
          if ! python3 scripts/scheduler-watchdog.py reconcile --status "$code" --health-file /tmp/health.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" ${prev:+--prev-run "$prev"} > /tmp/watchdog.json; then
            echo "::error::看門狗腳本執行失敗，保底補跑對帳（見 run log）"
            echo "backfill=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -c "import json; d=json.load(open('/tmp/watchdog.json')); print('看門狗：' + d['rule'] + '；' + '；'.join(d['summary']))" >> "$GITHUB_STEP_SUMMARY"

      - name: 補跑或手動觸發對帳
        id: backfill
        if: github.event_name == 'workflow_dispatch' || steps.watchdog.outputs.backfill == 'true'
        env:
          ENDPOINT: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api/internal/reconcile-pending-payments
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'github' || 'manual' }}
        run: |
          set -uo pipefail
          # 只重試連線層失敗（#458：runner DNS 解析失敗）。不用 curl --retry：它也會重打
          # 5xx，而 502 query_all_failed 是業務結果，重打只會多查 PayUni。
          for attempt in 1 2 3 4; do
            code="$(curl -sS -o /tmp/reconcile.json -w '%{http_code}' --max-time 150 -X POST "$ENDPOINT" \
              -H 'Content-Type: application/json' -H "x-internal-secret: $RECONCILE_SECRET" \
              --data "{\"trigger\":\"$TRIGGER\"}")"
            rc=$?
            case $rc in 6|7|28) echo "連線失敗（curl exit $rc），10 秒後重試（$attempt/4）"; sleep 10 ;; *) break ;; esac
          done
          echo "HTTP $code"
          # 契約（index.ts /internal/reconcile-pending-payments、reconcile-handler.ts）：
          #   200 { success: true, data: { checked, resolved, stillPending, ... } }
          #   200 { success: true, data: { skipped: 'concurrent' } }：另一輪正在跑，中性
          #   502 { success: false, error: { code: 'query_all_failed' } }：PayUni 查詢全滅
          python3 - "$code" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          code = sys.argv[1]
          try:
              d = json.load(open('/tmp/reconcile.json'))
          except Exception as e:
              sys.exit(f"::error::對帳回應不是合法 JSON（HTTP {code}）：{e}")
          if code != '200' or not d.get('success'):
              sys.exit(f"::error::對帳回報失敗（HTTP {code}）：{json.dumps(d, ensure_ascii=False)[:400]}")
          data = d.get('data') or {}
          if data.get('skipped') == 'concurrent':
              print('另一輪對帳正在執行（skipped:concurrent），本輪不重複執行。')
              sys.exit(0)
          missing = [k for k in ('checked', 'resolved', 'stillPending') if k not in data]
          if missing:
              sys.exit(f"::error::對帳回應缺少欄位 {missing}：{json.dumps(d, ensure_ascii=False)[:400]}")
          print("對帳完成：checked=%s resolved=%s stillPending=%s expired=%s" % (
              data['checked'], data['resolved'], data['stillPending'], data.get('expired', 0)))
          PY

      # system_alerts 新 error → LINE。用時間窗代替 notified_at 欄（10/29 起凍結
      # migration）：窗口＝上一次成功 run 的建立時間至今（排程會被 GitHub 丟棄，
      # 固定 N 分鐘會在間隔拉長時漏掉），上限 24 小時，找不到上一次就看 70 分鐘。
      # at-least-once：寧可偶爾重複推，也不漏。對帳本身紅了也要掃（always）。
      - name: 查詢近期 error 告警
        id: recent-alerts
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASE: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
        run: |
          set -uo pipefail
          prev="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-payments.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/tmp/gh-err.txt || true)"
          minutes=70
          if [ -z "$prev" ]; then
            echo "::warning::查不到上一次成功 run 的時間（$(head -c 200 /tmp/gh-err.txt 2>/dev/null)），窗口退回固定 ${minutes} 分鐘；排程被丟棄時可能漏告警。"
          else
            minutes="$(python3 -c "
          import datetime, math, sys
          p = datetime.datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
          m = math.ceil((datetime.datetime.now(datetime.timezone.utc) - p).total_seconds() / 60) + 1
          print(min(max(m, 1), 1440))  # 上限同端點 RECENT_ALERTS_MAX_MINUTES
          " "$prev")"
          fi
          code="$(curl -sS -o /tmp/alerts.json -w '%{http_code}' --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$API_BASE/internal/system-alerts/recent?minutes=$minutes" \
            -H "x-internal-secret: $RECONCILE_SECRET" || echo 000)"
          if [ "$code" = "404" ]; then
            # 端點隨後端部署才存在；晉升後、正式站部署核准前會有一段空窗。
            echo "::warning::告警查詢端點尚未部署（404），本輪略過。"
            echo "has_alerts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            if [ "$code" = "401" ]; then
              echo "::error::告警查詢被拒（401）：RECONCILE_SECRET 與後端不一致"
            else
              echo "::error::告警查詢失敗（HTTP $code，000＝連線失敗）：$(head -c 300 /tmp/alerts.json)"
            fi
            exit 1
          fi
          python3 - "$minutes" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          d = json.load(open('/tmp/alerts.json'))
          if not d.get('success'):
              sys.exit('::error::告警查詢回報失敗：' + json.dumps(d, ensure_ascii=False)[:300])
          alerts = d['data']['alerts']
          total = d['data']['total']
          print('has_alerts=%s' % ('true' if alerts else 'false'))
          # 只放來源與數量，不放 id 以外的內容；message 可能是自由文字，截短。
          shown = alerts[:5]
          lines = ['%s：%s' % (a['source'], str(a['message'])[:60]) for a in shown]
          body = '過去 %s 分鐘共 %s 筆 error。\n%s' % (sys.argv[1], total, '\n'.join(lines))
          # 端點最多回 20 筆、本文只列前 5 筆：超過的明細不在推播裡，註明總數
          # 讓人知道要去後台 system_alerts 看全部（總數本身一筆不少）。
          if total > len(shown):
              body += '\n（另有 %s 筆未列出，請至後台 system_alerts 查看）' % (total - len(shown))
          print('body<<EOF\n%s\nEOF' % body)
          PY

      - name: 對帳失敗時開 issue
        if: failure() && steps.backfill.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '付款對帳排程失敗';
            // 同一個故障不重複開 issue——排程每小時跑，壞掉就是每小時一張。
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: [],
            });
            if (existing.data.some((i) => i.title === title)) {
              core.info('已有未關閉的同名 issue，不重複建立');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## 付款對帳排程失敗',
                '',
                `- Run：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**影響**：卡在 pending 的訂單不會被自動撿回——付了錢的使用者',
                '可能停在「處理中」而無法使用會員功能。修好前建議手動確認',
                '`payment_orders` 是否有超過數小時仍 pending 的紀錄。',
                '',
                '排除後關閉此 issue，排程會在下個整點自動恢復。',
              ].join('\n'),
            });

      - name: 對帳失敗時推送 LINE 告警
        if: failure() && steps.backfill.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify
        with:
          level: P1
          title: 正式站付款對帳排程失敗
          body: 卡在 pending 的訂單不會被自動撿回
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          line_channel_token: ${{ secrets.LINE_CHANNEL_TOKEN }}
          line_to: ${{ secrets.LINE_ALERT_TO }}

      # 告警查詢壞了不等於對帳壞了（ops P2-7）：分開開 issue，文案不說「訂單撿不回」。
      - name: 告警查詢失敗時開 issue
        if: failure() && steps.recent-alerts.outcome == 'failure' && steps.backfill.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '對帳排程的告警查詢失敗';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            if (open.some((i) => i.title === title)) {
              core.info('已有未關閉的同名 issue，不重複建立');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## 對帳排程的告警查詢失敗',
                '',
                `- Run：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '對帳本身由 pg_cron 執行，這次失敗的是 `/internal/system-alerts/recent`（system_alerts 推 LINE）。',
                '影響：新的 error 告警暫時推不到 LINE（窗口不前移，恢復後會補推）。',
                '401 是 RECONCILE_SECRET 不一致；其他狀態看 run log。排除後關閉此 issue。',
              ].join('\n'),
            });

      # 放在最後一步、且不加 continue-on-error（刻意）：窗口起點是「上一次成功 run」，
      # 推送失敗必須讓 run 變紅，下一輪窗口才不前移、告警才會重送（at-least-once）。
      # 吞掉失敗＝窗口前移＝告警永久遺失。放最後是為了它紅了不會觸發上面
      # 「失敗時開 issue／推送」誤報「對帳排程失敗」。代價：LINE 持續壞掉時
      # 每輪都紅、每輪重送同一批（LINE 恢復前送不出去，恢復後單輪補送一次，
      # 窗口上限 24 小時）。
      # 缺 LINE secret 時 notify 會 no-op 並 exit 0——run 綠、窗口前移、告警遺失。
      # 這裡先擋：空的就 fail，窗口不前移（不改 notify 對其他呼叫端的 no-op 行為）。
      - name: 確認 LINE 推送設定存在
        if: ${{ !cancelled() && (steps.recent-alerts.outputs.has_alerts == 'true' || steps.watchdog.outputs.notify == 'true') }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_ALERT_TO: ${{ secrets.LINE_ALERT_TO }}
        run: |
          if [ -z "$LINE_CHANNEL_TOKEN" ] || [ -z "$LINE_ALERT_TO" ]; then
            echo "::error::LINE_CHANNEL_TOKEN／LINE_ALERT_TO 未設定，有新 error 告警卻無法推送；讓本輪失敗以免窗口前移、告警遺失。"
            exit 1
          fi

      - name: 有新 error 告警時推送 LINE
        if: ${{ !cancelled() && steps.recent-alerts.outputs.has_alerts == 'true' }}
        uses: ./.github/actions/notify
        with:
          level: P1
          title: 正式站 system_alerts 有新的 error
          body: ${{ steps.recent-alerts.outputs.body }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          line_channel_token: ${{ secrets.LINE_CHANNEL_TOKEN }}
          line_to: ${{ secrets.LINE_ALERT_TO }}

      # 看門狗的停擺／排程不存在／人為停用告警。同樣放最後、不加 continue-on-error：
      # 推送失敗讓 run 變紅，下一輪的節流以「上一次成功 run」為基準，才會重推。
      - name: 看門狗告警時推送 LINE
        if: ${{ !cancelled() && steps.watchdog.outputs.notify == 'true' }}
        uses: ./.github/actions/notify
        with:
          level: ${{ steps.watchdog.outputs.level }}
          title: ${{ steps.watchdog.outputs.title }}
          body: ${{ steps.watchdog.outputs.body }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          line_channel_token: ${{ secrets.LINE_CHANNEL_TOKEN }}
          line_to: ${{ secrets.LINE_ALERT_TO }}
