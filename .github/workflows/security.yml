name: Security Audit

# ============================================================================
# 相依漏洞掃描。刻意「不」放進 ci.yml 的 ci-ok：
# 新披露的 CVE 與這個 PR 改了什麼毫無關係，把它列成合併阻斷條件，等於
# 讓「今天有人在某個 transitive 相依上報了個漏洞」擋住所有人的工作——
# 那種閘門兩週內就會被關掉。
#
# 所以：每週跑一次 + 有發現就開 issue（有人接得住訊號），
# 排程與 Dependabot 的每週一批對齊，同一時段一起看。
# PR 上的即時把關由 Dependabot 的 security updates 負責。
# 頻率依據：每週一次，與 Dependabot 的每週一批對齊（見上），同一時段一起看。
# 新披露的 CVE 與任何單一 PR 無關，而掃出來的東西要人接手評估、決定升版或
# 註記例外——那是週級節奏的工作，日級頻率買不到日級價值。
# 成本可忽略（public repo 的標準 runner 不計費，單次也只有 ~25 秒）。
# ============================================================================
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

# ⚠️ 刻意不設 workflow 層 permissions:底下的 job 需要 issues: write
# (失敗時開 triage issue)。權限一律逐 job 宣告,語意最清楚。

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝前端相依
        run: npm ci

      - name: 掃描相依漏洞（npm audit）
        id: audit
        run: |
          set -uo pipefail
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const fs = require("node:fs");
            const a = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const v = a.metadata?.vulnerabilities ?? {};
            const bad = (v.high ?? 0) + (v.critical ?? 0);
            const line = `critical=${v.critical ?? 0} high=${v.high ?? 0} moderate=${v.moderate ?? 0} low=${v.low ?? 0}`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### npm audit\n\n\`${line}\`\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${bad}\n`);
            const names = Object.entries(a.vulnerabilities ?? {})
              .filter(([, d]) => ["high", "critical"].includes(d.severity))
              .map(([n, d]) => `- \`${n}\` (${d.severity}) — ${(d.via ?? []).map((x) => x.title ?? x).join("; ")}`)
              .join("\n");
            fs.writeFileSync("findings.md", names || "（無 high/critical）");
          '

      # Deno 相依（Edge Function）：選 deno 原生 `deno audit` 而非 osv-scanner——
      # 它直接讀 supabase/functions/deno.lock、不必引入第三方 action 或下載
      # 二進位，同樣查 GitHub advisory 資料庫。⚠️ 涵蓋範圍只有 lock 內的 npm
      # 套件；jsr 套件（@std/*、hono 若走 jsr）沒有 advisory 來源，掃不到。
      - name: 安裝 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 掃描 Deno 相依漏洞（deno audit）
        id: deno_audit
        working-directory: supabase/functions
        run: |
          set -uo pipefail
          status=0
          deno audit --level=high --ignore-registry-errors > ../../deno-audit.txt 2>&1 || status=$?
          cat ../../deno-audit.txt
          {
            echo '### deno audit'
            echo
            echo '```'
            cat ../../deno-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$status" >> "$GITHUB_OUTPUT"

      - name: 發現 high/critical 時開 issue
        if: steps.audit.outputs.count != '0' || steps.deno_audit.outputs.failed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const npmCount = Number('${{ steps.audit.outputs.count }}');
            const denoFailed = '${{ steps.deno_audit.outputs.failed }}' !== '0';
            const findings = [
              npmCount > 0 ? fs.readFileSync('findings.md', 'utf8') : '',
              denoFailed ? '### deno audit\n\n```\n' + fs.readFileSync('deno-audit.txt', 'utf8') + '\n```' : '',
            ].filter(Boolean).join('\n\n');
            const title = `相依安全掃描：npm ${npmCount} 個 high/critical${denoFailed ? '、Deno 有發現' : ''}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            const dup = open.data.find((i) => i.title.startsWith('相依安全掃描：'));
            const body = [
              '## 相依掃描發現 high/critical 漏洞',
              '',
              findings,
              '',
              `Run：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '處理方式：npm 用 `npm audit fix`、Deno 用 `deno audit --fix`（在 supabase/functions），或等 Dependabot 的週一批次。',
              '若是無修補版本的 transitive 相依，在此 issue 註記評估結果後關閉。',
            ].join('\n');
            if (dup) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
