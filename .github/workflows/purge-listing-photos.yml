name: Purge Listing Photos

# ============================================================================
# 條款十之一：使用者撤除的照片、帳號已刪除的會員留下的照片，三十日內要從公開
# bucket listings-photos 消失。即時路徑只涵蓋編輯存檔與刪刊登，帳號 cascade
# 刪除、離頁、逾時重試、並發等來源都會留下孤兒——這支排程呼叫
# POST /internal/purge-orphan-listing-photos 兜住全部（規格書 §11「照片檔清理」）。
#
# 刪的是**沒有備份**的 Storage 物件，所以：
#   - 預設 dry-run：排程只有 repo variable PHOTO_PURGE_LIVE == 'true' 才實刪
#     （W2-8：業主核對候選清單後才開）。dispatch 預設 dry-run；正式站的 dispatch
#     帶 dry_run=false 也要 PHOTO_PURGE_LIVE == 'true' 才實刪，否則強制改為
#     dry-run 並在 step summary 警告（W3-8）；develop 的 dispatch 照輸入
#   - 端點自帶斷路器（錨點失效、比例閘）；比例閘誤擋時 dispatch 帶
#     force_ratio=true 放行單輪
#   - body 組裝與回應判讀在 scripts/purge-listing-photos-request.py，
#     表格案例由 framework-check 每次 CI 跑
#
# ⚠️ repo 是 public，log／step summary／issue 全部公開。候選 name 含會員 uid：
# workflow 不送 include_names，log 只印狀態碼、code 與統計數字，不用 set -x、
# curl -v，也不印回應 body。要看清單時業主在本機 curl（規格書 §11 的 SOP）。
#
# pg-cron-schedulers（第 5 波 S1）起，**每日清理由 Supabase pg_cron 觸發**（UTC 19:17＝台北
# 03:17，migration 20261111000001；實刪看正式站 Edge secret PHOTO_PURGE_LIVE）。
# 這支 workflow 的排程改當**看門狗兼後備觸發**：
#   - 讀 GET /internal/scheduler-health；26 小時沒有完成的清理就自己補跑並推 LINE P2
#   - 開關一致性：pg_cron 路徑的實刪狀態與 repo var PHOTO_PURGE_LIVE 不一致時推 LINE P2
#     （W5-17：本波兩個開關並存）
#   - 決策在 scripts/scheduler-watchdog.py，表格案例由 framework-check 跑
#   - workflow_dispatch 的行為與 B1～B4 完全不變
#
# 頻率依據：每日一次。條款窗口三十日、寬限期 7 日（ORPHAN_GRACE_HOURS），清理本身已由
# pg_cron 準時觸發；看門狗只需每日確認一次。成本只有牆鐘（public repo 的標準 runner
# 免費）、補跑時的一次 Edge Function 呼叫，以及每日至多一則 LINE。排程取 UTC 20:47
# （台北 04:47）：pg_cron 的 19:17 之後一個半小時，當天那一輪應已完成。排程只打
# 正式站（W2-9）；develop 只走 dispatch。

# 前提：GitHub 只有一份 RECONCILE_SECRET，而 Supabase Secrets 逐分支獨立、
# 不繼承——develop 的 Supabase RECONCILE_SECRET 必須與正式站同值，dispatch
# 到 develop 才打得通（401 就是兩邊不同值）。
# ============================================================================
on:
  schedule:
    - cron: '47 20 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 清理目標
        type: choice
        options: [production, develop]
        default: production
      dry_run:
        description: 只列候選、不刪除
        type: boolean
        default: true
      force_ratio:
        description: 放行比例閘（僅本輪；錨點失效不可放行）
        type: boolean
        default: false

concurrency:
  group: purge-listing-photos-${{ inputs.target || 'production' }}
  cancel-in-progress: false

# ⚠️ 刻意不設 workflow 層 permissions：底下的 job 需要 issues: write
# （失敗時開 issue）。權限一律逐 job 宣告。

jobs:
  purge-orphan-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      # ref 的單一真相在 git（同 reconcile-payments.yml／deploy-supabase.yml），
      # vars 只是可選覆蓋；兩者不一致就中止，避免清錯環境。
      - name: 確認清理目標
        id: target
        env:
          REF_PROD_VARS: ${{ vars.SUPABASE_PROJECT_REF }}
          REF_DEV_VARS: ${{ vars.SUPABASE_DEVELOP_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            ref_from_git="$(python3 -c "import re; print(re.search(r'projectId\s*=\s*[\'\"]([a-z0-9]+)[\'\"]', open('src/utils/supabase/info.tsx').read()).group(1))")"
            ref_from_vars="$REF_PROD_VARS"
          else
            ref_from_git="$(python3 -c "import re; print(re.search(r'projectId:\s*[\'\"]([a-z0-9]+)[\'\"]', open('config/supabaseTarget.ts').read()).group(1))")"
            ref_from_vars="$REF_DEV_VARS"
          fi
          if [ -n "$ref_from_vars" ] && [ "$ref_from_vars" != "$ref_from_git" ]; then
            echo "::error::清理目標（$TARGET）的 vars 與 git 記載的 ref 不符——中止，不刪任何檔。"
            echo "::error::  vars = $ref_from_vars"
            echo "::error::  git  = $ref_from_git"
            exit 1
          fi
          echo "ref=$ref_from_git" >> "$GITHUB_OUTPUT"
          echo "清理目標：$TARGET（$ref_from_git）"

      # 排程觸發時先問 pg_cron 這一天有沒有做完；查不到狀態時決策就是補跑。
      - name: 看門狗判讀 pg_cron 清理狀態
        id: watchdog
        if: github.event_name == 'schedule'
        env:
          API_BASE: https://${{ steps.target.outputs.ref }}.supabase.co/functions/v1/api
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          REPO_LIVE: ${{ vars.PHOTO_PURGE_LIVE }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 \
            "$API_BASE/internal/scheduler-health" -H "x-internal-secret: $RECONCILE_SECRET" || echo 000)"
          code="$(printf '%s' "$code" | tail -c 3)"
          python3 scripts/scheduler-watchdog.py purge --status "$code" --health-file /tmp/health.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --repo-live "$REPO_LIVE" > /tmp/watchdog.json
          python3 -c "import json; d=json.load(open('/tmp/watchdog.json')); print('看門狗：' + (d['rule'] or 'OK') + '；' + '；'.join(d['summary']))" >> "$GITHUB_STEP_SUMMARY"

      - name: 呼叫孤兒清理端點
        id: call
        if: github.event_name == 'workflow_dispatch' || steps.watchdog.outputs.backfill == 'true'
        env:
          ENDPOINT: https://${{ steps.target.outputs.ref }}.supabase.co/functions/v1/api/internal/purge-orphan-listing-photos
          RECONCILE_SECRET: ${{ secrets.RECONCILE_SECRET }}
          EVENT: ${{ github.event_name }}
          # 實刪開關只管正式站（排程與 dispatch 都要它）；develop 只走 dispatch，依輸入決定。
          LIVE: ${{ (inputs.target || 'production') == 'production' && vars.PHOTO_PURGE_LIVE || '' }}
          DRY_INPUT: ${{ inputs.dry_run }}
          FORCE_INPUT: ${{ inputs.force_ratio }}
        run: |
          set -uo pipefail
          python3 scripts/purge-listing-photos-request.py body --event "$EVENT" --live "$LIVE" \
            --dry-input "$DRY_INPUT" --force-input "$FORCE_INPUT" --target "$TARGET" \
            > /tmp/purge-body.json 2> /tmp/purge-body-warn.txt
          if [ -s /tmp/purge-body-warn.txt ]; then
            cat /tmp/purge-body-warn.txt
            cat /tmp/purge-body-warn.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "送出參數：$(cat /tmp/purge-body.json)"
          code="$(curl -sS -o /tmp/purge-resp.json -w '%{http_code}' --max-time 150 -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' -H "x-internal-secret: $RECONCILE_SECRET" \
            --data @/tmp/purge-body.json 2>/dev/null || true)"
          python3 scripts/purge-listing-photos-request.py judge --status "$code" \
            --body-file /tmp/purge-resp.json --live "$LIVE" --sent-file /tmp/purge-body.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 失敗時開 issue
        if: failure() && steps.call.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          FAIL_CODE: ${{ steps.call.outputs.code }}
          FAIL_STATS: ${{ steps.call.outputs.stats }}
        with:
          script: |
            const target = process.env.TARGET;
            const title = `[${target}] 刊登照片孤兒清理失敗`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // 只放 run 連結、code、統計數字——repo 是 public，不放 name 與錯誤訊息。
            const detail = [
              `- Run：${runUrl}`,
              `- code：${process.env.FAIL_CODE || '（未取得，見 run log）'}`,
              `- 統計：${process.env.FAIL_STATS || '（無）'}`,
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              // 比例閘連日中止時不每天洗版：同標題已開就改留言。
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `再次失敗：\n${detail}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `## ${target} 刊登照片孤兒清理失敗`,
                '',
                detail,
                '',
                '**影響**：條款十之一要求撤除後三十日內下架，排程停擺會讓孤兒照片留在公開 bucket。',
                '三十日扣掉 7 日寬限期，約有兩週處理時間。',
                '',
                '- `circuit_open`＋`reason=ratio`：孤兒過半，一檔未刪。依規格書 §11「查看候選清單」在本機',
                '  dry-run（加 `force_ratio: true`）核對，確認無誤再 dispatch `force_ratio=true`、`dry_run=false`',
                '- `circuit_open`＋`reason=anchor`：多數刊登者的照片 URL 對不到物件（URL 格式變了或刊登都是死連結），',
                '  **不可放行**，先查 `listings.photos` 存的 URL 與 `_listing_photo_name_from_url` 的取法',
                '- `not_removed`：有物件 Storage 刪不掉、每輪霸佔額度。用 §11 的 dry-run 指令找出是哪些檔，再到 Dashboard 查',
                '- `unauthorized`：RECONCILE_SECRET 與該環境 Supabase Secrets 不一致',
                '- `not_deployed`：開了實刪或手動實刪卻 404，確認該環境 Edge Function 已部署且路由有註冊',
                '- 其他（`sweep_failed`、`bad_shape`、`http_*`）：看 run log 的 HTTP 狀態，`sweep_failed` 再看 Edge Function log',
                '',
                '排除後關閉此 issue。',
              ].join('\n'),
            });

      # 看門狗的逾期／開關不一致告警（P2）。放最後、不加 continue-on-error：推送失敗讓
      # run 變紅，留下紀錄。缺 LINE secret 時 notify 會 no-op，所以先擋。
      - name: 確認 LINE 推送設定存在
        if: ${{ !cancelled() && steps.watchdog.outputs.notify == 'true' }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_ALERT_TO: ${{ secrets.LINE_ALERT_TO }}
        run: |
          if [ -z "$LINE_CHANNEL_TOKEN" ] || [ -z "$LINE_ALERT_TO" ]; then
            echo "::error::LINE_CHANNEL_TOKEN／LINE_ALERT_TO 未設定，看門狗有告警卻無法推送。"
            exit 1
          fi

      - name: 看門狗告警時推送 LINE
        if: ${{ !cancelled() && steps.watchdog.outputs.notify == 'true' }}
        uses: ./.github/actions/notify
        with:
          level: ${{ steps.watchdog.outputs.level }}
          title: ${{ steps.watchdog.outputs.title }}
          body: ${{ steps.watchdog.outputs.body }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          line_channel_token: ${{ secrets.LINE_CHANNEL_TOKEN }}
          line_to: ${{ secrets.LINE_ALERT_TO }}
