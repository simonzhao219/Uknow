name: CI

# ============================================================================
# 分層閘門：越便宜的檢查越早給訊號，所有軌並行跑（牆鐘 > runner 分鐘，
# 公開 repo 的 runner 是免費且無限的，沒有省分鐘的必要）。
#
#   L1 static      ~45s   biome / tsc / knip / deno fmt+lint+check
#   L2 unit        ~70s   vitest(+coverage) / deno unit（不需要 DB）
#   L2 build       ~40s   vite build + bundle 預算
#   L3 api-tests   ~2.5m  deno DB 測試（本地 supabase）
#   L3 e2e-tests   ~2m    pytest-bdd + Playwright（全 mock，xdist 分片）
#   L3 journey-offline ~20s
#   L4 journey     ~30-90m  真後端全鏈路——只在 develop→main 晉升 PR 跑
#
# 所有軌匯總到 ci-ok（branch protection 的唯一 required check）。
# ============================================================================
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 同一 ref 的新 push 淘汰舊 run，不排隊燒 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 路徑過濾在 job 層做（不是 workflow 層）：required checks 需要 workflow
  # 每次都跑——workflow 層被 ignore 時 required check 永遠 pending、純文件
  # PR 會卡死無法合併；job 層 skip 則計為通過。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            backend:
              - 'supabase/**'

  # 框架軌：驗證 CLAUDE.md / .claude/ / hooks 腳本自身的健康度。
  # 秒級、免依賴、免 secrets，永遠執行——所以它可以無條件列入
  # required checks，同時兜住主軌路徑過濾放掉的框架檔案 PR。
  framework-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/framework-check.sh
      - name: Shellcheck hook scripts
        run: |
          shopt -s nullglob
          files=(scripts/git-hooks/* scripts/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck -S warning "${files[@]}"
          fi

  # ── L1：秒級靜態閘門 ────────────────────────────────────────────────
  # 前端與後端的靜態檢查合在同一 job：兩邊都是秒級，分開反而多付一次
  # runner 啟動與 checkout 的固定成本。
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 與本機 npm run check、pre-commit hook 共用同一定義，杜絕
      # 「本地綠 CI 紅」的規則漂移（vite build 用 SWC 只轉譯不檢查型別）
      - name: Biome
        run: npx biome check .
      - name: TypeScript
        run: npm run typecheck
      - name: Knip（未使用檔案／相依）
        run: npx knip --include files,dependencies

      - uses: denoland/setup-deno@v2
        if: needs.changes.outputs.backend == 'true'
        with:
          deno-version: v2.x
      # deno.json 定義了 fmt/lint 規則卻從沒在 CI 執行過（只有 pre-commit
      # 跑，而 pre-commit 在缺 deno / registry 不可達時會降級放行）——
      # 這三條把 Deno 側的規則接上唯一的強制點。
      # check 檢查 api/*.ts 全部而非只有 index.ts：測試檔（5700+ 行）
      # 過去從不做型別檢查，型別錯誤只有跑到才會炸。
      - name: Deno fmt
        if: needs.changes.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task fmt:check
      - name: Deno lint
        if: needs.changes.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task lint
      - name: Deno type-check（含測試檔）
        if: needs.changes.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task check

  # ── L2：單元測試（不碰資料庫，秒級回饋）────────────────────────────
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Vitest（含覆蓋率）
        run: npm run test:coverage

      # 覆蓋率要看得見才有用：印在 job summary，每個 PR 一眼可見趨勢。
      # 門檻本身由 vitest.config.ts 的 thresholds 強制（棘輪，只准往上）。
      - name: 覆蓋率摘要
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            let s;
            try { s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total; }
            catch { console.log("（無覆蓋率報告）"); process.exit(0); }
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`)
              .join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### 前端覆蓋率\n\n| 指標 | % | 已覆蓋/總數 |\n|---|---|---|\n${rows}\n`);
          '

      - uses: denoland/setup-deno@v2
        if: needs.changes.outputs.backend == 'true'
        with:
          deno-version: v2.x
      # 純函式後端測試（crypto / payuni-config / hardening）——不需要
      # supabase start，所以不該被綁在分鐘級的 api-tests 軌後面。
      # 這三支剛好都是安全相關（憑證混用、CORS 繞道、內部密鑰），
      # 放在最快的軌道上最划算。
      - name: Deno 單元測試（無 DB）
        if: needs.changes.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task test:unit

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 主 chunk 目前 955 kB / gzip 296 kB。預算是棘輪不是目標：
      # 擋住「無聲長大」，真的需要放寬時要在 PR 裡明說理由。
      - name: Bundle 預算
        run: node scripts/check-bundle-budget.mjs

  # ── L3：整合測試 ────────────────────────────────────────────────────
  api-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # 排除只有 GUI/可觀測性用途的服務，省下約 30s 的映像拉取與啟動。
      # 測試需要的是 db / auth / rest / storage。
      - name: Start local Supabase
        run: supabase start -x studio,logflare,vector,supavisor

      - name: Export local Supabase connection info
        run: |
          echo "SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"

      # 刻意不跑 supabase stop：job 結束整台 runner 就回收，那 20s 純浪費。
      - name: Run Deno DB tests
        working-directory: supabase/functions
        run: deno task test:db

  e2e-tests:
    # e2e/ 是 Python（pytest-bdd + Playwright）套件，網路全 mock，
    # 免 secrets，靠 npm run dev 驅動（不吃 build/ 產物）——所以刻意
    # 「不」needs: build，串行只會把牆鐘從 max(各 job) 拉成相加。
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install e2e dependencies
        run: pip install -r e2e/requirements.txt

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      # dev server 由 workflow 顯式起：conftest 的 Popen(shell=True) 殺的是
      # shell wrapper，node 子程序會留下來（CI log 的 "Terminate orphan
      # process: npm run dev" 就是它）。在這裡起、由 runner 回收，乾淨。
      - name: Start dev server
        run: |
          npm run dev &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "dev server ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev server 120s 內未就緒"; exit 1

      # 刻意「不」用 pytest-xdist 平行化：實測全量 182 個情境同時跑時，
      # 已經有兩個情境會因資源競爭失敗（單獨跑、單檔跑都穩定通過）。
      # 這套件貼著時間懸崖，再加並發等於拿主閘門的可信度換 90 秒。
      # 速度從「刪掉在下層已經驗過的重複情境」拿，不從並發拿。
      - name: Run e2e suite
        working-directory: e2e
        env:
          PYTHONUNBUFFERED: '1'
          E2E_SKIP_DEV_SERVER: '1'
        run: |
          pytest --browser chromium \
            --screenshot only-on-failure \
            --video retain-on-failure \
            --tracing retain-on-failure \
            --output test-results \
            -q

      - name: Upload e2e test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  journey-offline:
    # journey 套件的離線防線：純函數單元測試（twid / orgchart /
    # payuni_crypto）＋情境收集健全性。不需要瀏覽器、不需要 secrets、
    # 不打任何網路——真正的 journey 執行在 journey.yml。
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/journey/requirements.txt

      - name: Install journey dependencies
        run: pip install -r e2e/journey/requirements.txt

      - name: Offline unit tests
        working-directory: e2e/journey
        run: pytest tools/ -q

      - name: Scenario collection sanity
        working-directory: e2e/journey
        run: pytest --collect-only -q

  # ── L4：晉升閘門（只在 develop→main 的 PR）──────────────────────────
  # 「上線前」是全鏈路驗證唯一真正該擋的一刻。晉升 PR 是週級頻率，
  # 30-90 分鐘完全付得起；日常 feature PR 則完全不受影響（skip）。
  # 與 nightly 共用同一份 reusable workflow，杜絕兩份定義漂移
  # （main / develop 兩個副本各自演化正是 2026-07 那次的成因）。
  journey:
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/journey.yml
    with:
      scope: full
      payment_mode: sandbox
    secrets: inherit

  # ── 護欄 ────────────────────────────────────────────────────────────
  # PR 分支必須用 rebase 更新，不得用 merge 更新。
  # branch protection 的「Require branches to be up to date」只保證 head 含
  # 最新 base，不管你是怎麼含進去的；按 Update branch 預設塞的是 merge
  # commit。這條把「含進去的方式」也鎖成 rebase：分支上出現任何 merge
  # commit 就紅燈。GitHub 沒有任何設定能強制 Update branch 用 rebase。
  #
  # ⚠️ base 是 main 時必須跳過：晉升 PR（develop→main）帶的正是 develop
  # 上累積的 feature merge commit（合併規矩就是 --no-ff），這條若照跑，
  # 每一個晉升 PR 都會永久紅燈、ci-ok 跟著紅、晉升永遠合不進去。
  linear-check:
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # 預設會 checkout refs/pull/N/merge（GitHub 合成的試合併結果，
          # 本身就是 merge commit）——必須指名 head sha 才量得到真正的
          # PR 分支；fetch-depth: 0 才有 base 分支可以比對。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: PR 分支不得含 merge commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          merges=$(git rev-list --merges "origin/$BASE_REF..HEAD")
          if [ -n "$merges" ]; then
            echo "::error::PR 分支含 merge commit,請改用 rebase 更新:"
            echo "$merges" | while read -r sha; do
              git --no-pager log -1 --format='  %h %s' "$sha"
            done
            echo "修法:git fetch origin $BASE_REF \\"
            echo "     && git rebase origin/$BASE_REF \\"
            echo "     && git push --force-with-lease"
            exit 1
          fi
          echo "OK:相對 origin/$BASE_REF 為線性歷史"

  # migration 是對正式資料庫的不可逆操作（main 合併後由 Supabase 原生
  # 整合自動套用），而且**已套用過的檔案改內容不會重跑**——改舊檔等於
  # 本機/CI 與正式站永久分歧且無聲。這條把它變成紅燈。
  migration-guard:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 既有 migration 不得被修改或刪除
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-status "origin/$BASE_REF...HEAD" -- supabase/migrations/ || true)
          bad=$(echo "$changed" | grep -E '^(M|D|R)' || true)
          if [ -n "$bad" ]; then
            echo "::error::既有 migration 被修改/刪除——已套用的 migration 不會重跑,正式站將與版本庫永久分歧"
            echo "$bad"
            echo "修法:另開一支新的 migration 做增量修正,不要改舊檔"
            exit 1
          fi
          echo "OK:只有新增 migration"

  # 唯一該列入 branch protection required checks 的項目。
  # 逐條把 job 加進 required 清單會漂移——2026-07-25 的 PR #109 就是這樣
  # 在 api-tests / e2e-tests 還在跑的時候被 auto-merge 合掉的(那兩條不在
  # 清單裡,build 一綠條件就滿足)。改成單一匯總點:新增 job 只要進
  # needs,保護規則永遠不用動,也不可能再漏。
  ci-ok:
    needs:
      - changes
      - framework-check
      - static
      - unit
      - build
      - api-tests
      - e2e-tests
      - journey-offline
      - journey
      - linear-check
      - migration-guard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 匯總各軌結果
        env:
          # skipped 計為通過:純文件 PR 會 skip 重的 job(見 changes 那段
          # 註解)、linear-check 在 push 事件與晉升 PR 不跑、journey 只在
          # 晉升 PR 跑。把 skipped 當失敗會讓這些情況永遠合不了。
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "各軌結果:$RESULTS"
          failed=0
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::有軌未通過(failure/cancelled),不得合併"
            exit 1
          fi
