name: CI

# ============================================================================
# 分層閘門：越便宜的檢查越早給訊號，重的軌並行跑。
#
# 本 repo 於 **2026-08-07 轉為 public**：GitHub-hosted 標準 runner 對 public
# repo 免費且無用量上限，所以這裡**不再有計費分鐘可省**。
# （沿革：2026-08-07 之前是 private，當天帳號分鐘數用罄+spending limit
#   觸頂、所有 workflow 停擺兩小時；那次事故留下的「每 job 進位計費」
#   成本模型已隨轉 public 失效。此處刻意只記「現在是什麼」，不維護一份
#   「以前不是什麼」的清單。）
#
# 現在的稀缺資源是**牆鐘**——CI 回饋要多久才回得來，以及 runner 併發數。
# 併軌與拆軌的取捨因此改看「最慢那條軌的時長」，不是 job 數量。
#
#   牆鐘（2026-08 實測，單次 run；runner 快慢差異可達 42%，見下）：
#   guards         ~10s   路徑過濾＋框架健檢＋linear＋migration（共乘）
#   L1 static      ~30s   biome / tsc / knip / deno fmt+lint+check
#   L2 unit        ~45s   vitest(+coverage) / deno unit（不需要 DB）
#   L2 build       ~20s   vite build + bundle 預算
#   L3 api-tests   ~3 分  deno DB 測試（本地 supabase）
#   L3 e2e-tests   ~4 分  pytest-bdd + Playwright（全 mock），156 個測試
#   L3 journey-offline ~15s
#   L4 journey     30-90 分  真後端全鏈路——只在 develop→main 晉升 PR 跑
#   ci-ok          ~5s    匯總（branch protection 的唯一 required check）
#
#   重軌並行，所以一次 run 的牆鐘 ≈ 最慢那條（e2e-tests），約 4 分鐘。
#
#   ⚠️ 量測時務必知道 **runner 快慢的變異比多數最佳化都大**：同一份 e2e
#   套件在 2026-08-07 的兩次 run，pytest step 分別是 233s 與 330s（+42%）。
#   單次量測不足以歸因任何改動，要比就多取樣。
# ============================================================================
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 同一 ref 的新 push 淘汰舊 run，不排隊燒 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ 這裡刻意不設 workflow 層 permissions:它是**上限**而不是預設值,
# 每個 job（含 uses: 呼叫的 reusable workflow）都不得超過它。設成
# contents: read 會讓 guards 的 pull-requests: read 與 journey 的
# issues: write 變成越權,GitHub 在建圖階段就拒絕整個 workflow
# （startup_failure,連 check run 都不會建立）。權限一律逐 job 宣告。

jobs:
  # 路徑過濾在 job 層做（不是 workflow 層）：required checks 需要 workflow
  # 每次都跑——workflow 層被 ignore 時 required check 永遠 pending、純文件
  # PR 會卡死無法合併；job 層 skip 則計為通過。
  #
  # guards 是四個秒級守衛（路徑過濾／框架健檢／linear／migration）的共乘
  # job：拆成四個 job 時，每個都要各自付 checkout + setup 的固定開銷來買
  # 不到 40 秒的運算，合併後總牆鐘 ~10 秒。（併軌當初的理由是「每 job
  # 進位計費」，那個前提已隨轉 public 失效；但共乘在牆鐘上依然划算，
  # 所以結論不變、依據換了。）job id 刻意保持單字：outputs 被
  # needs.guards.outputs.* 引用，連字號會被表達式剖析器讀成減法
  # （見 .claude/rules/github-actions.md 的連字號陷阱）。
  # 代價（已接受）：linear/migration 紅燈時，等 guards 的重軌不會啟動，
  # 該次 push 只拿到守衛訊號——但守衛紅本來就該先修。
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 判斷本次變更範圍
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # predicate-quantifier 預設是 some（「符合任一 pattern 即命中」），
          # 那會讓 '**' 先成立、底下三條負向排除永遠不被考慮，code 對任何
          # 變更都回 true——本 filter 從加入到 2026-07-25 都沒 skip 過任何
          # 東西。every 要求所有 pattern 都成立，負向排除才生效。
          # 由 scripts/check-workflows.py 機械把關（framework-check 軌）。
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            backend:
              - 'supabase/**'

      # 框架步：驗證 CLAUDE.md / .claude/ / hooks 腳本自身的健康度。
      # 秒級、免依賴、免 secrets，永遠執行——兜住主軌路徑過濾放掉的
      # 框架檔案 PR。
      - name: 框架健康檢查
        run: bash scripts/framework-check.sh
      - name: Shell 腳本靜態檢查（shellcheck）
        run: |
          shopt -s nullglob
          files=(scripts/git-hooks/* scripts/*.sh)
          if [ "${#files[@]}" -gt 0 ]; then
            shellcheck -S warning "${files[@]}"
          fi

      # 以下守衛需要真正的 PR head 與完整歷史：預設 checkout 的是
      # refs/pull/N/merge（GitHub 合成的試合併結果，本身就是 merge
      # commit），量 linear 歷史必須指名 head sha；fetch-depth: 0 才有
      # base 分支可比對。重新 checkout 會覆蓋工作區——框架健檢已在上面
      # 用試合併結果跑完，順序不可對調。
      - name: 取出 PR head 與完整歷史（linear／migration 守衛用）
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # PR 分支必須用 rebase 更新，不得用 merge 更新。
      # branch protection 的「Require branches to be up to date」只保證 head
      # 含最新 base，不管你是怎麼含進去的；按 Update branch 預設塞的是
      # merge commit。這條把「含進去的方式」也鎖成 rebase。GitHub 沒有
      # 任何設定能強制 Update branch 用 rebase。
      #
      # ⚠️ base 是 main 時必須跳過：晉升 PR（develop→main）帶的正是
      # develop 上累積的 feature merge commit（合併規矩就是 --no-ff），
      # 這條若照跑，每一個晉升 PR 都會永久紅燈、晉升永遠合不進去。
      - name: PR 分支不得含 merge commit
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          merges=$(git rev-list --merges "origin/$BASE_REF..HEAD")
          if [ -n "$merges" ]; then
            echo "::error::PR 分支含 merge commit,請改用 rebase 更新:"
            echo "$merges" | while read -r sha; do
              git --no-pager log -1 --format='  %h %s' "$sha"
            done
            echo "修法:git fetch origin $BASE_REF \\"
            echo "     && git rebase origin/$BASE_REF \\"
            echo "     && git push --force-with-lease"
            exit 1
          fi
          echo "OK:相對 origin/$BASE_REF 為線性歷史"

      # migration 是對正式資料庫的不可逆操作（main 合併後由 Supabase 原生
      # 整合自動套用），而且**已套用過的檔案改內容不會重跑**——改舊檔等於
      # 本機/CI 與正式站永久分歧且無聲。這條把它變成紅燈。
      - name: 既有 migration 不得被修改或刪除
        if: github.event_name == 'pull_request' && steps.filter.outputs.backend == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-status "origin/$BASE_REF...HEAD" -- supabase/migrations/ || true)
          bad=$(echo "$changed" | grep -E '^(M|D|R)' || true)
          if [ -n "$bad" ]; then
            echo "::error::既有 migration 被修改/刪除——已套用的 migration 不會重跑,正式站將與版本庫永久分歧"
            echo "$bad"
            echo "修法:另開一支新的 migration 做增量修正,不要改舊檔"
            exit 1
          fi
          echo "OK:只有新增 migration"
      # supabase_migrations.schema_migrations 以**數字版本**為主鍵（不是檔名）,
      # 同號兩支檔案在字典序上看似有先後,實際上第二支一插入就 PK 衝突,
      # 整批 migration 套用中斷（2026-08-02 PR #188 實測:duplicate key
      # value violates unique constraint "schema_migrations_pkey"）。
      - name: migration 版本號不得重複
        if: github.event_name == 'pull_request' && steps.filter.outputs.backend == 'true'
        run: |
          set -euo pipefail
          dups=$(ls supabase/migrations/ | grep -E '^[0-9]+_' | cut -d_ -f1 | sort | uniq -d || true)
          if [ -n "$dups" ]; then
            echo "::error::migration 版本號重複——schema_migrations 以數字版本為主鍵,第二支套用時直接 PK 衝突"
            for v in $dups; do ls supabase/migrations/ | grep "^${v}_"; done
            echo "修法:把其中一支改成未被占用的版本號(通常整支改名往後挪一號,連同其中的相依順序一起確認)"
            exit 1
          fi
          echo "OK:版本號無重複"

  # ── L1：秒級靜態閘門 ────────────────────────────────────────────────
  # 前端與後端的靜態檢查合在同一 job：兩邊都是秒級，分開反而多付一次
  # runner 啟動與 checkout 的固定成本。
  static-checks:
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝前端相依
        run: npm ci

      # 與本機 npm run check、pre-commit hook 共用同一定義，杜絕
      # 「本地綠 CI 紅」的規則漂移（vite build 用 SWC 只轉譯不檢查型別）
      - name: 前端風格與 lint（Biome）
        run: npx biome check .
      - name: 前端型別檢查（tsc）
        run: npm run typecheck
      - name: 未使用檔案與相依（Knip）
        run: npx knip --include files,dependencies

      - name: 安裝 Deno
        uses: denoland/setup-deno@v2
        if: needs.guards.outputs.backend == 'true'
        with:
          deno-version: v2.x
      # deno.json 定義了 fmt/lint 規則卻從沒在 CI 執行過（只有 pre-commit
      # 跑，而 pre-commit 在缺 deno / registry 不可達時會降級放行）——
      # 這三條把 Deno 側的規則接上唯一的強制點。
      # check 檢查 api/*.ts 全部而非只有 index.ts：測試檔（5700+ 行）
      # 過去從不做型別檢查，型別錯誤只有跑到才會炸。
      - name: 後端格式檢查（deno fmt）
        if: needs.guards.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task fmt:check
      - name: 後端 lint（deno lint）
        if: needs.guards.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task lint
      - name: 後端型別檢查含測試檔（deno check）
        if: needs.guards.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task check

  # ── L2：單元測試（不碰資料庫，秒級回饋）────────────────────────────
  unit-tests:
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝前端相依
        run: npm ci

      - name: 前端單元測試與覆蓋率（Vitest）
        run: npm run test:coverage

      # 覆蓋率要看得見才有用：印在 job summary，每個 PR 一眼可見趨勢。
      # 門檻本身由 vitest.config.ts 的 thresholds 強制（棘輪，只准往上）。
      - name: 輸出覆蓋率摘要到 job summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            let s;
            try { s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total; }
            catch { console.log("（無覆蓋率報告）"); process.exit(0); }
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`)
              .join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### 前端覆蓋率\n\n| 指標 | % | 已覆蓋/總數 |\n|---|---|---|\n${rows}\n`);
          '

      - name: 安裝 Deno
        uses: denoland/setup-deno@v2
        if: needs.guards.outputs.backend == 'true'
        with:
          deno-version: v2.x
      # 純函式後端測試（crypto / payuni-config / hardening）——不需要
      # supabase start，所以不該被綁在分鐘級的 api-tests 軌後面。
      # 這三支剛好都是安全相關（憑證混用、CORS 繞道、內部密鑰），
      # 放在最快的軌道上最划算。
      - name: 後端純函式測試（不需資料庫）
        if: needs.guards.outputs.backend == 'true'
        working-directory: supabase/functions
        run: deno task test:unit

  build-bundle:
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝前端相依
        run: npm ci
      - name: 建置產出（Vite）
        run: npm run build
      # 主 chunk 目前 955 kB / gzip 296 kB。預算是棘輪不是目標：
      # 擋住「無聲長大」，真的需要放寬時要在 PR 裡明說理由。
      - name: 檢查 bundle 預算
        run: node scripts/check-bundle-budget.mjs

  # ── L3：整合測試 ────────────────────────────────────────────────────
  api-tests:
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 安裝 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # 排除只有 GUI/可觀測性用途的服務，省下約 30s 的映像拉取與啟動。
      # 測試需要的是 db / auth / rest / storage。
      - name: 啟動本地 Supabase
        run: supabase start -x studio,logflare,vector,supavisor

      - name: 匯出本地 Supabase 連線資訊
        run: |
          echo "SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')" >> "$GITHUB_ENV"

      # 刻意不跑 supabase stop：job 結束整台 runner 就回收，那 20s 純浪費。
      - name: 後端整合測試（需資料庫）
        working-directory: supabase/functions
        run: deno task test:db

  e2e-tests:
    # e2e/ 是 Python（pytest-bdd + Playwright）套件，網路全 mock，
    # 免 secrets，靠 npm run dev 驅動（不吃 build/ 產物）——所以刻意
    # 「不」needs: build，串行只會把牆鐘從 max(各 job) 拉成相加。
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安裝前端相依
        run: npm ci

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: 安裝 e2e 相依
        run: pip install -r e2e/requirements.txt

      - name: 快取 Playwright 瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安裝 Playwright 瀏覽器
        run: playwright install chromium --with-deps

      # dev server 由 workflow 顯式起：conftest 的 Popen(shell=True) 殺的是
      # shell wrapper，node 子程序會留下來（CI log 的 "Terminate orphan
      # process: npm run dev" 就是它）。在這裡起、由 runner 回收，乾淨。
      - name: 啟動 dev server
        run: |
          npm run dev &
          for _ in $(seq 1 120); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "dev server ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev server 120s 內未就緒"; exit 1

      # 刻意「不」用 pytest-xdist 平行化：實測全量同跑時，已經有情境會因
      # 資源競爭失敗（單獨跑、單檔跑都穩定通過）。這套件貼著時間懸崖，
      # 再加並發等於拿主閘門的可信度換 90 秒。
      # 速度從「刪掉在下層已經驗過的重複情境」拿，不從並發拿——2026-08-07
      # 依此刪掉 18 個情境（含 Outline 展開共 18 個 test case），每一條都在 vitest 元件測試或
      # api-tests 有指名的接手方；pytest step 實測 233s → 184s。
      # ⚠️ 那條資源競爭 flake 仍在（`listing_management` 的建立刊登情境
      # 曾在全量跑紅、單獨跑穩定綠）——全量紅了先單獨重跑一次再判斷。
      - name: e2e 情境測試（全 mock）
        working-directory: e2e
        env:
          PYTHONUNBUFFERED: '1'
          E2E_SKIP_DEV_SERVER: '1'
        run: |
          pytest --browser chromium \
            --screenshot only-on-failure \
            --video retain-on-failure \
            --tracing retain-on-failure \
            --output test-results \
            -q

      - name: 上傳 e2e 測試產物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  journey-offline:
    # journey 套件的離線防線：純函數單元測試（twid / orgchart /
    # payuni_crypto）＋情境收集健全性。不需要瀏覽器、不需要 secrets、
    # 不打任何網路——真正的 journey 執行在 journey.yml。
    needs: guards
    if: needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/journey/requirements.txt

      - name: 安裝 journey 相依
        run: pip install -r e2e/journey/requirements.txt

      - name: journey 離線純函式測試
        working-directory: e2e/journey
        run: pytest tools/ -q

      - name: journey 情境收集健全性
        working-directory: e2e/journey
        run: pytest --collect-only -q

  # ── L4：晉升閘門（只在 develop→main 的 PR）──────────────────────────
  # 「上線前」是全鏈路驗證唯一真正該擋的一刻。晉升 PR 是週級頻率，
  # 30-90 分鐘完全付得起；日常 feature PR 則完全不受影響（skip）。
  # 與 nightly 共用同一份 reusable workflow，杜絕兩份定義漂移
  # （main / develop 兩個副本各自演化正是 2026-07 那次的成因）。
  # needs: guards 但**不讀它的 outputs**——兩件事要分開看：
  #   - 不讀 outputs：晉升 PR 就算只改文件也要跑全鏈路，路徑過濾不適用於
  #     這一軌（其餘重軌都掛 needs.guards.outputs.code == 'true'，這裡沒有）
  #   - 仍然 needs：guards 是秒級的，紅了就代表框架/linear/migration 已經
  #     壞掉，此時再開一個拋棄式 Supabase 分支跑 30-90 分鐘是純浪費
  #     （Supabase 分支不受 Actions 免費額度涵蓋，那是另一份帳單）。
  journey-full:
    needs: guards
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    # 呼叫端的權限是被呼叫 workflow 的**上限**——journey.yml 的 job 要
    # issues: write（失敗時開 triage issue），這裡沒給就會是越權而整個
    # workflow 拒絕啟動。
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/journey.yml
    with:
      scope: full
      payment_mode: sandbox
    secrets: inherit

  # 唯一該列入 required status checks 的項目(來源:ruleset
  # protect-main-develop)。逐條把 job 加進清單會漂移——改成單一匯總點:
  # 新增 job 只要進 needs,規則永遠不用動,也不可能再漏。
  #
  # ⚠️ 這一切的前提是規則真的會被詢問。ruleset 在 private repo 上是付費
  # 功能,免費方案下 enforcement 顯示 active 卻完全不執行。本 repo 的規則
  # 建於 2026-07-25、2026-08-07 轉 public 才生效;期間 PR #109 / #205 /
  # #199 都在 CI 未跑完時合併成功——不是清單漏了誰,是沒人問過閘門。
  # 詳見 .claude/rules/github-actions.md 規則 7。
  #
  # ⚠️ check-run 的**名稱**依事件區隔,這不是美化(規則 9)。required status
  # check 的鍵是 (commit SHA, check-run 名稱),**不綁 workflow run**。晉升 PR
  # 的 head SHA 就是 develop 的 tip,而那顆 SHA 早已被 push run 跑過一輪——
  # 若兩個 run 的匯總點同名,push run 那顆(裡面 journey-full 必然 skipped、
  # 而 skipped 算通過)就會在 PR 開啟前先蓋上綠章,PR run 自己的 ci-ok 又因
  # needs 未完成而尚未建立 check run,於是保護規則從頭到尾看到的都是那顆廉價
  # 綠章、沒有黃燈可擋。PR #236 就是這樣在 journey-full 還在跑時合併進 main 的。
  # push run 改名成 ci-ok-push 後,晉升 PR 的 required check 會停在
  # 「Waiting for status to be reported」直到自己的匯總點真的跑完。
  ci-ok:
    name: ${{ github.event_name == 'pull_request' && 'ci-ok' || 'ci-ok-push' }}
    needs:
      - guards
      - static-checks
      - unit-tests
      - build-bundle
      - api-tests
      - e2e-tests
      - journey-offline
      - journey-full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 匯總各軌結果
        env:
          # skipped 計為通過:純文件 PR 會 skip 重的 job(見 guards 那段
          # 註解)、journey 只在晉升 PR 跑。把 skipped 當失敗會讓這些情況
          # 永遠合不了。(linear/migration 已是 guards 內的 step,紅了就是
          # guards 紅,不經 skipped 語意。)
          RESULTS: ${{ join(needs.*.result, ' ') }}
          # 晉升 PR 的例外(規則 10):journey-full 是上線前唯一的真後端閘門,
          # 對它套用「skipped 算通過」等於「沒跑也算過」。base=main 時單獨把
          # 它拉出來要求 success。needs 的 job id 帶連字號,必須用索引語法。
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          JOURNEY_RESULT: ${{ needs['journey-full'].result }}
        run: |
          echo "各軌結果:$RESULTS"
          failed=0
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -eq 1 ]; then
            echo "::error::有軌未通過(failure/cancelled),不得合併"
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$JOURNEY_RESULT" != "success" ]; then
              echo "::error::晉升 PR 的 journey-full 是 '$JOURNEY_RESULT'——上線前唯一的真後端閘門必須真的通過,skipped/cancelled 都不算"
              exit 1
            fi
            echo "晉升 PR:journey-full 已確認 success"
          fi
