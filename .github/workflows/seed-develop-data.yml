name: Seed Develop Data

# ============================================================================
# 把示範資料種進 **develop 分支 DB**（persistent branch，不是拋棄式分支）。
#
# 與 journey.yml 的關係：走同一套 GUI 建樹機制（註冊三步 + PayUni sandbox
# 付款 + 逐代推進），但生命週期相反——
#
#   journey.yml          開拋棄式分支 → 跑完 → 刪分支（資料必然不存在）
#   本檔                 目標是既有的 develop 分支 → 跑完 → **資料留著**
#
# 所以刻意不共用 journey.yml：那支的「一定刪掉分支」是安全設計，把它變成
# 有條件的，等於把最重要的保險做成可關的開關。
#
# 為什麼需要它：develop 站台的前端改指向 develop 分支 DB 之後（PR #134），
# 那個 DB 是空的——沒有資料就看不出任何獎勵/推薦/任務的畫面。
#
# 觸發：只有手動。種一次就夠，重跑會在既有資料上再疊一棵樹。
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      root_email:
        description: 'root 帳號 email（其餘 44 人用 e2e+<run_id>+<節點>@ 生成）'
        type: string
        default: root@gmail.com
      run_id:
        description: '這批資料的識別前綴（日後要清除時給 tools/cleanup.py --run-id 用）'
        type: string
        default: seed
      build_parallelism:
        description: '同一代內平行建置的瀏覽器數'
        type: string
        default: '8'

# 與 journey 共用同一個閘：兩者都會刷 PayUni sandbox 的共用狀態，
# 同時只允許一場。
concurrency:
  group: journey-scheduled
  cancel-in-progress: false

jobs:
  seed-develop-data:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 45 個帳號、每個都要走完註冊三步與 sandbox 刷卡；30 人的 journey 全套
    # 是 90 分鐘，這裡只建樹但人多，取 120 分鐘。
    timeout-minutes: 120
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PARENT_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DEVELOP_FRONTEND_URL: https://develop.uknow.pages.dev
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      # PayUni sandbox 憑證是「成套」需求：resolvePayuniConfig 在
      # PAYUNI_SANDBOX=true 時只認 PAYUNI_TEST_* 三件套，缺一個就拋錯，
      # 且刻意不回退到正式站憑證（見 index.ts 該函式的註解——混搭憑證會讓
      # PayUni 回「授權失敗(模擬)」）。secrets 沒設時 GitHub 代入空字串，
      # 症狀是建樹跑到付款才吃 /payuni/prepare 500（run 30186374052）。
      - name: 前置檢查（PayUni sandbox 憑證）
        run: |
          missing=''
          [ -n "${{ secrets.PAYUNI_TEST_MER_ID }}" ]   || missing="$missing PAYUNI_TEST_MER_ID"
          [ -n "${{ secrets.PAYUNI_TEST_HASH_KEY }}" ] || missing="$missing PAYUNI_TEST_HASH_KEY"
          [ -n "${{ secrets.PAYUNI_TEST_HASH_IV }}" ]  || missing="$missing PAYUNI_TEST_HASH_IV"
          if [ -n "$missing" ]; then
            echo "::error::缺 repository secret:$missing"
            echo "::error::下線要付款才會產生推薦獎勵，而 sandbox 模式只認這三件套、"
            echo "::error::不會回退到正式站憑證（那會讓 PayUni 回「授權失敗(模擬)」）。"
            echo "::error::請向 PayUni 取得測試站商店代號與金鑰後加進 repository secrets。"
            exit 1
          fi

      - name: 前置檢查（root 密碼 secret）
        run: |
          if [ -z "${{ secrets.SEED_ROOT_PASSWORD }}" ]; then
            echo "::error::缺 repository secret SEED_ROOT_PASSWORD——root 帳號的密碼。"
            echo "::error::刻意不寫在檔案裡：這是公開 repo，而 workflow_dispatch 的"
            echo "::error::input 值會出現在 run 的 UI 上，兩條路都會外洩。"
            exit 1
          fi

      - name: 安裝 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: 取得 develop 分支的連線資訊
        id: branch
        run: |
          set -euo pipefail
          supabase link --project-ref "$PARENT_PROJECT_REF"
          supabase branches get develop --experimental -o env > branch.env

          # 解析方式與 journey.yml 同一套,理由也同一個:欄位名會隨 CLI 版本
          # 變,`grep '^ANON_KEY='` 撈不到時會靜默傳空字串下去(2026-07 那次
          # 假綠,以及本檔首跑 run 30174097721 的失敗,都是這個)。比對尾綴、
          # 容忍任意前綴,解析不到就當場失敗。
          extract() { grep -oPm1 "^[A-Z0-9_]*${1}=\K.*" branch.env | tr -d '"' || true; }
          BRANCH_REF="$(extract 'REF')"
          [ -n "$BRANCH_REF" ] || BRANCH_REF="$(grep -oPm1 'https://\K[a-z0-9]+(?=\.supabase\.co)' branch.env || true)"
          ANON_KEY="$(extract 'ANON_KEY')"
          SERVICE_KEY="$(extract 'SERVICE_ROLE_KEY')"

          missing=''
          [ -n "$BRANCH_REF" ]  || missing="$missing BRANCH_REF"
          [ -n "$ANON_KEY" ]    || missing="$missing ANON_KEY"
          [ -n "$SERVICE_KEY" ] || missing="$missing SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::branch.env 解析不到:$missing —— CLI 欄位名可能已變"
            echo "branch.env 實際有的欄位名（不印值）:"
            grep -oP '^[A-Z0-9_]+(?==)' branch.env | sed 's/^/  /'
            exit 1
          fi

          # 種資料專屬的第二道確認:目標必須是 develop 分支,不能是正式專案。
          if [ "$BRANCH_REF" = "$PARENT_PROJECT_REF" ]; then
            echo "::error::分支 ref 等於正式專案 $PARENT_PROJECT_REF——中止。"
            exit 1
          fi

          # 這兩個是真密鑰,務必讓 Actions 遮蔽,以免任何 step 的 env 傾印外洩
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"

          echo "ref=$BRANCH_REF" >> "$GITHUB_OUTPUT"
          {
            echo "JOURNEY_SUPABASE_PROJECT_REF=$BRANCH_REF"
            echo "JOURNEY_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "JOURNEY_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY"
          } >> "$GITHUB_ENV"

      # 建樹期間前端跑在 runner 的 3100 埠，所以 FRONTEND_URL 要指向它
      # （付款完成後的導回網址）。收尾步驟會設回 develop 站台網址——
      # 忘了設回去的話，develop 上真人付款會被導去一個不存在的 localhost。
      - name: 設定 develop 分支（sandbox 金流與 auth 限流）
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "${{ steps.branch.outputs.ref }}" \
            PAYUNI_SANDBOX=true \
            PAYUNI_TEST_MER_ID="${{ secrets.PAYUNI_TEST_MER_ID }}" \
            PAYUNI_TEST_HASH_KEY="${{ secrets.PAYUNI_TEST_HASH_KEY }}" \
            PAYUNI_TEST_HASH_IV="${{ secrets.PAYUNI_TEST_HASH_IV }}" \
            FRONTEND_URL="http://localhost:3100"
          # 兩件事一起設：
          # 1. rate_limit_email_sent：45 人註冊會發 45 封 OTP 信，內建 SMTP 的
          #    預設額度是個位數。OTP 實際由 Admin API 取得，信收不收得到無所謂，
          #    但限流會擋住註冊本身。
          # 2. mailer_autoconfirm=false：develop 分支原本把 email 確認關掉了
          #    （與正式站不一致）。自動確認的帳號讓 Admin API 的
          #    generate_link(type=signup) 回 422——run 30175036725 就是這樣死在
          #    A0。前端的註冊流程本來就有 OTP 那一步，關掉確認等於 develop 的
          #    註冊 UX 與正式站不同，順手改回來。
          auth_api="https://api.supabase.com/v1/projects/${{ steps.branch.outputs.ref }}/config/auth"
          patch_auth() {  # $1 = JSON body → 印出 "HTTP碼 回應本文"
            curl -sS -w '\n%{http_code}' -X PATCH \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "$auth_api" -d "$1"
          }

          # 兩個欄位必須分開送。合併送的話整包會被拒——rate_limit_email_sent
          # 需要專案先設好 custom SMTP，沒設就回 401，連帶讓同一包裡的
          # mailer_autoconfirm 一起失效（run 30176329217 的實測訊息：
          # "Custom SMTP required to configure SMTP_SENDER_NAME or
          #  RATE_LIMIT_EMAIL_SENT"）。這正是第三次執行「PATCH 看似成功、
          # 設定卻沒生效」的真正原因。
          confirm_out="$(patch_auth '{"mailer_autoconfirm": false}')"
          confirm_code="$(echo "$confirm_out" | tail -1)"
          if [ "$confirm_code" != "200" ]; then
            echo "::error::關閉自動確認 email 失敗（HTTP $confirm_code）："
            echo "$confirm_out" | head -5
            exit 1
          fi

          # 限流放寬是 best-effort：沒有 custom SMTP 就一定失敗，而那是專案
          # 設定問題，不是本 workflow 能解的。仍然照跑是因為有 custom SMTP
          # 的環境會成功；失敗時明講後果，不要讓人以為只是雜訊。
          rate_out="$(patch_auth '{"rate_limit_email_sent": 200}')"
          rate_code="$(echo "$rate_out" | tail -1)"
          if [ "$rate_code" != "200" ]; then
            echo "::warning::email 寄送限流未能放寬（HTTP $rate_code）：$(echo "$rate_out" | head -1)"
            echo "::warning::內建 SMTP 的額度是每小時個位數，45 人註冊會撞牆——"
            echo "::warning::要種完整棵樹，該分支專案需要先設定 custom SMTP。"
          fi

          # 設完回頭讀一次確認生效。前三次執行的教訓：run 30175585595 明明
          # PATCH 過了卻仍然死在同一個 422——「送出設定」與「設定生效」是
          # 兩件事，而靜默的 no-op 比明確的失敗貴得多（每次都要燒一輪 CI
          # 才發現）。這裡把它變成前置條件斷言。
          autoconfirm="$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$auth_api" \
            | grep -o '"mailer_autoconfirm":[^,}]*' | head -1)"
          echo "目前的 email 確認設定：${autoconfirm:-（讀不到欄位）}"
          case "$autoconfirm" in
            *true*)
              echo "::error::develop 分支仍是自動確認 email（mailer_autoconfirm=true）。"
              echo "::error::GUI signUp 會直接產生已確認帳號，Admin API 的"
              echo "::error::generate_link(type=signup) 對它回 422，建樹取不到 OTP。"
              echo "::error::請到 Supabase dashboard → 該分支專案 → Authentication →"
              echo "::error::Sign In / Providers → Email，把 Confirm email 打開後重跑。"
              exit 1
              ;;
          esac

      # 種資料不是冪等的：root 用固定 email，已存在時 GUI 註冊入口會切換成
      # 登入表單，建樹會以一個難懂的畫面錯誤死在第 0 代（run 30175036725 的
      # 殘留就是這樣留下的）。與其讓人事後從截圖反推，不如開跑前就講清楚。
      - name: 前置檢查（root email 尚未存在於目標分支）
        run: |
          set -uo pipefail
          users="$(curl -sS \
            -H "apikey: $JOURNEY_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $JOURNEY_SUPABASE_SERVICE_ROLE_KEY" \
            "https://${{ steps.branch.outputs.ref }}.supabase.co/auth/v1/admin/users?per_page=1000")"
          if echo "$users" | grep -q "\"email\":\"${{ inputs.root_email }}\""; then
            echo "::error::${{ inputs.root_email }} 已存在於 develop 分支——種資料不是冪等的。"
            echo "::error::要重種請先清除既有資料（見 workflow 摘要的 cleanup 指令），"
            echo "::error::或改用不同的 root_email 執行。"
            exit 1
          fi

      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝前端相依
        run: npm ci

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/journey/requirements.txt
      - name: 安裝 journey 相依
        run: pip install -r e2e/journey/requirements.txt
      - name: 快取 Playwright 瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: 安裝 Playwright 瀏覽器
        run: playwright install chromium --with-deps

      - name: 種示範資料（45 人走 GUI 註冊與付款）
        working-directory: e2e/journey
        env:
          PYTHONUNBUFFERED: '1'
          JOURNEY_REQUIRE_ENV: '1'
          # 三個開關缺一不可，缺任何一個都不會種：
          #   -m seed                 pytest.ini 預設是 -m "not seed"
          #   JOURNEY_SEED=1          步驟裡的第二道保險
          #   JOURNEY_ORGCHART_PATH   沒設就是測試用的 30 人樹，步驟會硬失敗
          JOURNEY_SEED: '1'
          JOURNEY_ORGCHART_PATH: orgchart-develop-seed.yaml
          JOURNEY_KEEP_DATA: '1'
          JOURNEY_ROOT_EMAIL: ${{ inputs.root_email }}
          JOURNEY_ROOT_PASSWORD: ${{ secrets.SEED_ROOT_PASSWORD }}
          JOURNEY_RUN_ID: ${{ inputs.run_id }}
          JOURNEY_PAYMENT_MODE: sandbox
          JOURNEY_PAYUNI_HASH_KEY: ${{ secrets.PAYUNI_TEST_HASH_KEY }}
          JOURNEY_PAYUNI_HASH_IV: ${{ secrets.PAYUNI_TEST_HASH_IV }}
          # PayUni sandbox 刷卡頁要填的測試卡（人審提供，2026-07-26）。
          # 卡號與 conftest 預設相同，有效期不同——預設 0131 已過期，
          # 格式是 MMYY，所以 09/33 寫成 0933。
          # 注意這與 PAYUNI_TEST_* 三件套是兩回事：那三個是後端建單用的
          # 商店憑證，缺了連刷卡頁都到不了，卡號正確也用不上。
          JOURNEY_TEST_CARD_NUMBER: '4147631000000001'
          JOURNEY_TEST_CARD_EXPIRY: '0933'
          JOURNEY_TEST_CARD_CVV: '123'
          JOURNEY_BUILD_PARALLELISM: ${{ inputs.build_parallelism }}
        run: |
          mkdir -p test-results
          pytest -m seed --browser chromium \
            --screenshot only-on-failure --tracing retain-on-failure \
            --output test-results \
            --junitxml=test-results/junit.xml -v

      # 不論成敗都要設回去：留著 localhost:3100 的話，develop 上的真人付款
      # 會被導向一個不存在的位址。
      - name: 收尾（FRONTEND_URL 設回 develop 站台）
        if: always()
        run: |
          supabase secrets set --project-ref "${{ steps.branch.outputs.ref }}" \
            FRONTEND_URL="$DEVELOP_FRONTEND_URL"

      - name: 上傳建置結果與憑證對照表
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: seed-develop-${{ github.run_id }}
          path: |
            e2e/journey/test-results/
            e2e/journey/.run/
          retention-days: 14
          if-no-files-found: ignore

      - name: 產出摘要
        if: success()
        run: |
          {
            echo "## develop 示範資料已種好"
            echo ""
            echo "- 站台：$DEVELOP_FRONTEND_URL"
            echo "- root 帳號：\`${{ inputs.root_email }}\`（密碼見 SEED_ROOT_PASSWORD）"
            echo "- 樹形：第 1 代 32 人、第 2 代 8 人、第 3 代 4 人（共 45 個帳號）"
            echo "- root 預期點數：4,400P；全樹發出 6,000P"
            echo "- 其餘 44 人的帳密對照表在 artifact 的 \`.run/${{ inputs.run_id }}.json\`"
            echo ""
            echo "要清除這批資料：\`cd e2e/journey && python tools/cleanup.py --run-id ${{ inputs.run_id }}\`"
            echo "（root 用固定 email，不在前綴掃描範圍內，需另外手動刪除）"
          } >> "$GITHUB_STEP_SUMMARY"
