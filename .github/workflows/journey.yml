name: Journey

# ============================================================================
# 六代 30 人全功能 Journey 套件（e2e/journey/）——打真後端的全鏈路驗證。
#
# 一次執行 = 一個拋棄式 Supabase preview branch：測前建立、測後刪除
# ＝資料保證清乾淨（cleanup.py 的零殘留斷言是第二道保險）。
#
# 呼叫點有三個，共用這一份定義（曾經 main / develop 各有一份副本各自
# 演化，假綠燈就是這樣長出來的）：
#   1. ci.yml 的 journey job —— develop→main 晉升 PR 必跑（上線前閘門）
#   2. journey-scheduled.yml —— 每週台北週日 02:00 排程與手動觸發的薄外殼
#      （它只負責 triggers 與 concurrency，邏輯全在這裡）
#
# ⚠️ 本 workflow 的第一設計要求是「不可能假綠」：
#   - 連線資訊解析不到 → 硬失敗（而不是傳空字串下去讓情境靜默 skip）
#   - 實際執行情境數低於下限 → 硬失敗（deselect / skip 都會 exit 0）
# 2026-07-21 的兩次「全綠」實際上是 27 個情境全 skip、套件跑了 0.2 秒。
#
# 需要的 repository secrets：
#   SUPABASE_ACCESS_TOKEN      既有（deploy-supabase.yml 同一把）
#   PAYUNI_TEST_MER_ID         PayUni sandbox 商店代號
#   PAYUNI_TEST_HASH_KEY       PayUni sandbox HashKey
#   PAYUNI_TEST_HASH_IV        PayUni sandbox HashIV
# 需要的 repository variables：
#   SUPABASE_PROJECT_REF       正式專案 ref（分支從它長出來）
# ============================================================================
on:
  workflow_call:
    inputs:
      scope:
        description: 'full=全 30 人六模組；skeleton=單人骨架'
        type: string
        default: full
      payment_mode:
        description: 'sandbox=真刷測試卡；webhook=簽章注入備援'
        type: string
        default: sandbox
      pytest_expr:
        description: >-
          可選的 pytest marker 運算式（自由字串，如 timemachine、
          renewal_saga）。有值時取代 scope 的 marker 選擇、只跑命中的
          feature，並自動附加 and not seed（CLI 的 -m 會整段蓋掉 ini 的
          not seed 預設，這裡把排除補回來）；「跑了幾個」的下限同時降為
          MIN_FILTERED。空值時行為與過去完全相同。
        type: string
        default: ''

# ⚠️ 這裡刻意不設 concurrency。reusable workflow 的 workflow 層 concurrency
# 會參與呼叫端的排隊:2026-07-25 實測,呼叫端 run 被 cancel-in-progress
# 取消後,這個 group 的 slot 沒有乾淨釋放,後續每一個 run 都永遠卡在
# pending、連一個 job 都不會建立(PR #114 的 run 30157868894)。
# 「同時最多一場 journey」的保護改放在 journey-scheduled.yml——真正需要它
# 的是排程/手動路徑(分支費用＋PayUni sandbox 共用狀態);PR 路徑本來就
# 被 ci.yml 的 concurrency: ci-<ref> 蓋住了。

# ⚠️ 刻意不設 workflow 層 permissions:底下的 job 需要 issues: write
# (失敗時開 triage issue)。權限一律逐 job 宣告,語意最清楚。

jobs:
  journey-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PARENT_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SCOPE: ${{ inputs.scope || 'full' }}
      PAYMENT_MODE: ${{ inputs.payment_mode || 'sandbox' }}
      PYTEST_EXPR: ${{ inputs.pytest_expr || '' }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # ------------------------------------------------------------------
      # 1. 開拋棄式 preview branch（名稱帶 run id，殘留可辨識）
      #
      #    ⚠️ 分支的 schema 是「replay 母專案 supabase_migrations.
      #    schema_migrations 裡**存下來的語句**」，不是 git 裡的檔案。
      #    兩者可以漂移：0008 當年以無防呆的舊版套進 production，git
      #    檔案後來才補上存在性檢查——replay 在全新 DB 上炸掉，分支停在
      #    MIGRATIONS_FAILED、schema 只到 0007，2026-07-26 起排程 7 晚
      #    全紅就是這個。歷史語句已修復對齊 git（2026-08-02），這裡的
      #    狀態硬斷言是防它復發的閘門：半套 schema 的分支絕不往下跑。
      # ------------------------------------------------------------------
      - name: 建立拋棄式 Supabase 分支
        id: branch
        run: |
          set -euo pipefail
          BRANCH_NAME="journey-${{ github.run_id }}"
          echo "name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          supabase link --project-ref "$PARENT_PROJECT_REF"
          supabase branches create "$BRANCH_NAME" --experimental

          # 等 migration replay 到終態，並驗證它真的成功——「連得上」不等於
          # 「schema 是全的」，只等連線資訊就往下跑正是 7 晚假訊號的溫床。
          STATUS=''
          for _ in $(seq 1 60); do
            STATUS="$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PARENT_PROJECT_REF/branches" \
              | python3 -c 'import json,sys; bs=json.load(sys.stdin); print(next((b.get("status","") for b in bs if b.get("name")==sys.argv[1]), ""))' \
                "$BRANCH_NAME" || true)"
            case "$STATUS" in
              MIGRATIONS_PASSED|FUNCTIONS_DEPLOYED|FUNCTIONS_FAILED) break ;;
              MIGRATIONS_FAILED)
                echo "::error::分支 migration replay 失敗（MIGRATIONS_FAILED）——分支只有半套 schema。"
                echo "::error::常見原因：母專案 schema_migrations 的歷史語句與 git 漂移（手動套用後才改檔案）。"
                echo "::error::修法：把該版本的 statements 更新成 git 檔案內容（git 檔案有 CI 在全新 DB 驗證過）。"
                exit 1 ;;
            esac
            sleep 10
          done
          case "$STATUS" in
            MIGRATIONS_PASSED|FUNCTIONS_DEPLOYED) ;;
            FUNCTIONS_FAILED)
              echo "::warning::分支函式自動部署失敗（FUNCTIONS_FAILED）——不影響本 run，下面會自行部署 api" ;;
            *)
              echo "::error::等了 10 分鐘分支仍未到終態（最後狀態：${STATUS:-查不到}）"
              exit 1 ;;
          esac

          supabase branches get "$BRANCH_NAME" --experimental -o env > branch.env

          # 診斷用,一律印出(不只在解析失敗時)——不印值,只印欄位名。
          # 2026-09-02 起 db push 反覆撞 SQLSTATE 42P05(prepared statement
          # already exists):查證後這不是暫時性競態,是 db push 內部執行
          # SET session_replication_role,需要 session 一致性,而 POSTGRES_URL
          # 目前拿到的是 transaction-mode pooler,結構上不支援。官方建議
          # migrations 用 direct URL,但本檔已證實 direct URL 在 GitHub
          # runner 上因為只有 IPv6 而連不上(見下方 DB_URL 註解)。若 CLI
          # 這個版本的 branch env 有額外提供 session-mode pooler(IPv4 相容
          # 但走 session 而非 transaction pooling,通常是同一個 pooler
          # hostname、port 5432)的欄位,這裡先印出來確認欄位名長怎樣,
          # 再決定要不要改抓那個欄位當 DB_URL——不要用猜的,上一次猜欄位名
          # 錯了就是靜默傳空字串然後全數 skip(2026-07 那次假綠)。
          echo "::group::branch.env 實際欄位名(診斷用,不印值)"
          grep -oP '^[A-Z0-9_]+(?==)' branch.env | sed 's/^/  /' || true
          echo "::endgroup::"

          # 欄位名會隨 CLI 版本變（2026-07 那次假綠就是 grep '^ANON_KEY='
          # 撈不到而靜默傳了空字串）——改成比對「尾綴」，容忍任意前綴。
          extract() { grep -oPm1 "^[A-Z0-9_]*${1}=\K.*" branch.env | tr -d '"' || true; }
          BRANCH_REF="$(extract 'REF')"
          [ -n "$BRANCH_REF" ] || BRANCH_REF="$(grep -oPm1 'https://\K[a-z0-9]+(?=\.supabase\.co)' branch.env || true)"
          ANON_KEY="$(extract 'ANON_KEY')"
          SERVICE_KEY="$(extract 'SERVICE_ROLE_KEY')"
          # db push 走 pooler URL（POSTGRES_URL）：直連 URL（NON_POOLING，
          # db.<ref>.supabase.co）只有 IPv6，GitHub runner 沒有 IPv6 路由，
          # 2026-08-02 run 30761819572 實測 dial 直接 unreachable；CLI 的
          # 錯誤訊息也明示改用 IPv4 pooler。
          DB_URL="$(extract 'POSTGRES_URL')"
          [ -n "$DB_URL" ] || DB_URL="$(extract 'POSTGRES_URL_NON_POOLING')"

          # 診斷用:印出 host:port(user:password 先自己剝掉,不靠事後
          # ::add-mask:: ——遮蔽是「之後才生效」,印出當下就已經外洩了)。
          # 目的是直接確認 POSTGRES_URL 現在給的到底是不是 transaction-mode
          # pooler(慣例 port 6543),還是這個 CLI 版本其實已經給別的。
          echo "::group::DB_URL 結構(診斷用,已剝除帳密)"
          echo "POSTGRES_URL host:port = $(printf '%s' "$(extract 'POSTGRES_URL')" | sed -E 's#^[a-z]+://[^@]*@##; s#/.*##' || true)"
          echo "POSTGRES_URL_NON_POOLING host:port = $(printf '%s' "$(extract 'POSTGRES_URL_NON_POOLING')" | sed -E 's#^[a-z]+://[^@]*@##; s#/.*##' || true)"
          echo "::endgroup::"

          # 硬斷言：解析不到就當場失敗。傳空字串下去只會讓每個情境
          # 靜默 skip，然後整場「成功」——那比紅燈危險得多。
          missing=''
          [ -n "$BRANCH_REF" ]   || missing="$missing BRANCH_REF"
          [ -n "$ANON_KEY" ]     || missing="$missing ANON_KEY"
          [ -n "$SERVICE_KEY" ]  || missing="$missing SERVICE_ROLE_KEY"
          [ -n "$DB_URL" ]       || missing="$missing POSTGRES_URL"
          if [ -n "$missing" ]; then
            echo "::error::branch.env 解析不到:$missing —— CLI 欄位名可能已變"
            echo "branch.env 實際有的欄位名（不印值）:"
            grep -oP '^[A-Z0-9_]+(?==)' branch.env | sed 's/^/  /'
            exit 1
          fi

          # 這些是真密鑰,務必讓 Actions 遮蔽,以免任何 step 意外印出
          # （DB_URL 內嵌 DB 密碼，整串遮蔽）
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"
          echo "::add-mask::$DB_URL"

          echo "ref=$BRANCH_REF" >> "$GITHUB_OUTPUT"
          {
            echo "JOURNEY_SUPABASE_PROJECT_REF=$BRANCH_REF"
            echo "JOURNEY_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "JOURNEY_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY"
            echo "JOURNEY_BRANCH_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # replay 只到母專案（main）已套用的最後一版；本 run 測的卻是
      # checkout（develop / 晉升 PR head）的程式碼。develop 獨有的
      # migration 不補上，Edge Function 就是新程式打舊 schema。db push
      # 只套「本地有、分支歷史沒有」的版本，等於預演晉升時 production
      # 會做的 migration 套用——這裡紅了，晉升也會紅，早知道早修。
      #
      # 上面的 STATUS 輪詢只證明 replay「已收斂到某個終態」，不保證
      # 「這一刻資料庫已經追上母專案的全部歷史」——2026-09-02 promote PR
      # #302 實測兩次撞到 schema_migrations_pkey 重複鍵，兩次撞號的版本
      # 各不同（第 6 支、重跑後第 8 支），證明背景 replay 在兩次嘗試之間
      # 持續推進，只是永遠追不上 db push 開跑的時間點：STATUS API 回報
      # 終態的時間點，早於 replay 真正寫完全部歷史列的時間點。
      #
      # 撞到這個特定的主鍵重複，恰恰是「這個版本剛被背景 replay 插入」的
      # 即時證據，比重新輪詢 STATUS 更可靠——所以直接拿它當重試訊號：
      # 短暫等待後重新呼叫 db push，它會用資料庫當下的真實狀態重新判斷
      # 「本地有、分支沒有」，自然收斂到只剩真正新增的版本。非這個錯誤
      # 模式的失敗（例如 migration 內容本身有問題）不重試，直接紅燈。
      - name: 套用 checkout 的 migrations 到分支
        run: |
          # GitHub Actions 的 run: 一律用 `bash -e {0}` 呼叫這支 script——
          # errexit 在 script 第一行執行前就已經開著。下面 set -uo pipefail
          # 不含 +e，蓋不掉繼承來的 -e：db push 一失敗，errexit 當場終止
          # 整支 script，永遠到不了下面 PUSH_STATUS 那行，重試邏輯形同虛設
          # （2026-09-02 實測:PR #302 撞到,失敗訊息只有 supabase CLI 自己
          # 印的錯誤,沒有下面任何一行 ::warning:: 或 ::error::,秒級失敗)。
          # 必須先 set +e 明確蓋掉繼承的 -e。
          set +e
          set -uo pipefail
          ATTEMPT=0
          MAX_ATTEMPTS=10
          while :; do
            ATTEMPT=$((ATTEMPT + 1))
            supabase db push --db-url "$JOURNEY_BRANCH_DB_URL" 2>&1 | tee push.log
            PUSH_STATUS=${PIPESTATUS[0]}
            [ "$PUSH_STATUS" -eq 0 ] && break

            # SQLSTATE 23505＝schema_migrations 主鍵重複(replay 追不上,見上）；
            # 42P05＝prepared statement 已存在——PgBouncer transaction-mode
            # pooling 下,上一次嘗試的 CLI process 被 errexit 中斷前沒機會
            # DEALLOCATE,連線被交還連線池後,下一次嘗試若拿回同一條底層
            # connection 就會撞到殘留的 prepared statement（2026-09-02 PR
            # #302 第二次重跑實測:第 1 次撞 23505 重試後,第 2 次撞
            # 42P05）。兩者都是「重試本身」在連線池上引發的殘留狀態，不是
            # migration 內容有問題，一併視為可重試訊號。
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && grep -qE 'SQLSTATE (23505|42P05)' push.log; then
              echo "::warning::分支背景 migration replay 尚未追上母專案,或連線池殘留前次嘗試的狀態(第 $ATTEMPT 次),15 秒後重試"
              sleep 15
              continue
            fi

            echo "::error::db push 失敗(第 $ATTEMPT 次,結束碼 $PUSH_STATUS)——非已知的 replay 競態模式,或已達重試上限 $MAX_ATTEMPTS 次"
            exit 1
          done

      # ------------------------------------------------------------------
      # 2. 分支環境設定：Edge Function secrets（sandbox 金流）＋
      #    GoTrue 寄信改走 no-op send-email hook。
      #
      #    為什麼需要 hook（2026-08-02 run 30762264071 實測）：hosted
      #    GoTrue 用內建 email 服務時，(a) 直接拒收 example/test 保留
      #    網域（error_code=email_address_invalid）——journey 的
      #    @uknow-journey.test 假帳號連 signup 都進不去；(b) 不掛自訂
      #    寄送管道不准調 rate_limit_email_sent（401 Custom SMTP
      #    required）。掛上 hook 後寄信不再經內建 mailer，兩個限制一起
      #    解除；OTP 本來就由 Admin generate_link 取得，信件內容無所謂。
      #    sink 函數用 psql 建在拋棄式分支上，不進 migration、不碰正式站。
      # ------------------------------------------------------------------
      - name: 設定分支（函式 secrets、email sink hook、auth 限流）
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "${{ steps.branch.outputs.ref }}" \
            PAYUNI_SANDBOX=true \
            PAYUNI_TEST_MER_ID="${{ secrets.PAYUNI_TEST_MER_ID }}" \
            PAYUNI_TEST_HASH_KEY="${{ secrets.PAYUNI_TEST_HASH_KEY }}" \
            PAYUNI_TEST_HASH_IV="${{ secrets.PAYUNI_TEST_HASH_IV }}" \
            FRONTEND_URL="http://localhost:3100"

          psql "$JOURNEY_BRANCH_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public.journey_email_sink(event jsonb)
            returns jsonb language sql as 'select ''{}''::jsonb';
          grant usage on schema public to supabase_auth_admin;
          grant execute on function public.journey_email_sink(jsonb) to supabase_auth_admin;
          SQL

          patch_auth() {
            curl -sS -w '\n%{http_code}' -X PATCH \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/${{ steps.branch.outputs.ref }}/config/auth" \
              -d "$1" || true
          }

          # hook 是註冊能不能動的前提——失敗就硬停，帶回應失敗
          resp="$(patch_auth '{"hook_send_email_enabled": true, "hook_send_email_uri": "pg-functions://postgres/public/journey_email_sink"}')"
          code="${resp##*$'\n'}"
          if [ "$code" != "200" ]; then
            echo "::error::send-email hook 設定失敗（HTTP ${code}）——GUI 註冊將全滅:"
            printf '%s\n' "$resp" | head -5
            exit 1
          fi
          echo "send-email hook 已啟用"

          # 限流放寬失敗降級為警告：skeleton 用不到，full 的 30 人建樹才會撞
          resp="$(patch_auth '{"rate_limit_email_sent": 100}')"
          code="${resp##*$'\n'}"
          if [ "$code" != "200" ]; then
            echo "::warning::auth rate limit 調整失敗（HTTP ${code}）——30 人建樹可能撞 email 限流"
            printf '%s\n' "$resp" | head -5
          fi

      # 分支是從 main 的 migrations 長出來的,但 Edge Function 不會自動
      # 跟上——不部署就是拿舊版函式測新版程式碼,測了也不算數。
      - name: 部署 Edge Function 到該分支
        run: |
          supabase functions deploy api \
            --project-ref "${{ steps.branch.outputs.ref }}" --no-verify-jwt

      # GUI 註冊掛掉時只看得到「30 秒沒等到 OTP 框」——toast 早就消失，
      # 錯誤原因蒸發（2026-08-02 run 30761921729）。先用 REST 直接探測
      # signup：會失敗就在這裡帶著 GoTrue 的真實回應失敗，不要讓 55 個
      # 情境去撞一個必死的註冊入口。探測帳號當場刪掉，不留殘留。
      - name: auth 註冊健檢（signup 探測）
        run: |
          set -euo pipefail
          BASE="https://${{ steps.branch.outputs.ref }}.supabase.co"
          echo "GoTrue settings（節錄）:"
          curl -sS "$BASE/auth/v1/settings" -H "apikey: $JOURNEY_SUPABASE_ANON_KEY" \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); print(json.dumps({k:s.get(k) for k in ("disable_signup","mailer_autoconfirm","external")}, ensure_ascii=False)[:500])' || true

          PROBE_EMAIL="e2e+authprobe-${{ github.run_id }}@uknow-journey.test"
          resp="$(curl -sS -w '\n%{http_code}' -X POST "$BASE/auth/v1/signup" \
            -H "apikey: $JOURNEY_SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$PROBE_EMAIL\",\"password\":\"Probe!Aa12345678\"}")"
          code="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "::error::signup 探測失敗（HTTP ${code}）——GUI 註冊必然全滅，先修這個:"
            printf '%s\n' "$body" | head -5
            exit 1
          fi
          echo "signup 探測通過（HTTP 200）"

          # 清掉探測帳號（id 從回應撈；signup 回應頂層即 user 物件）
          probe_id="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or d.get("user",{}).get("id") or "")')"
          if [ -n "$probe_id" ]; then
            curl -sS -X DELETE "$BASE/auth/v1/admin/users/$probe_id" \
              -H "apikey: $JOURNEY_SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $JOURNEY_SUPABASE_SERVICE_ROLE_KEY" > /dev/null \
              || echo "::warning::探測帳號刪除失敗（$PROBE_EMAIL）——不影響測試，分支測後即刪"
          fi

      # ------------------------------------------------------------------
      # 3. 跑套件
      # ------------------------------------------------------------------
      - name: 安裝 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝前端相依
        run: npm ci

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/journey/requirements.txt
      - name: 安裝 journey 相依
        run: pip install -r e2e/journey/requirements.txt
      - name: 快取 Playwright 瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # 本 job 裝的是 e2e/journey/requirements.txt，快取鍵就得綁同一份——
          # 綁到 e2e/requirements.txt 會讓 journey 的 playwright 版本改動不
          # 失效快取（回退到 playwright install 自己重抓，等於白付一次下載）。
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/journey/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: 安裝 Playwright 瀏覽器
        run: playwright install chromium --with-deps

      - name: journey 全鏈路測試（真後端）
        working-directory: e2e/journey
        env:
          PYTHONUNBUFFERED: '1'
          # conftest 看到 JOURNEY_REQUIRE_ENV=1 時,環境缺件改為硬失敗
          # 而不是 skip——本機沒設環境仍然 skip,只有 CI 不容許靜默放過。
          JOURNEY_REQUIRE_ENV: '1'
          JOURNEY_PAYMENT_MODE: ${{ env.PAYMENT_MODE }}
          JOURNEY_PAYUNI_HASH_KEY: ${{ secrets.PAYUNI_TEST_HASH_KEY }}
          JOURNEY_PAYUNI_HASH_IV: ${{ secrets.PAYUNI_TEST_HASH_IV }}
          JOURNEY_RUN_ID: gh${{ github.run_id }}
          JOURNEY_BUILD_PARALLELISM: '8'
        run: |
          mkdir -p test-results
          # marker 選擇的優先序：pytest_expr（窄選）> scope=skeleton > 全套。
          # 窄選一律補 and not seed——CLI 的 -m 後出現者勝，會整段蓋掉 ini
          # 的 -m "not seed" 預設，不補回來的話與 @seed 有交集的運算式會把
          # seed 情境放進來白燒 CI。
          ARGS=()
          if [ -n "$PYTEST_EXPR" ]; then
            ARGS+=(-m "($PYTEST_EXPR) and not seed")
          elif [ "$SCOPE" = 'skeleton' ]; then
            ARGS+=(-m skeleton)
          fi
          pytest "${ARGS[@]}" --browser chromium \
            --screenshot only-on-failure --tracing retain-on-failure \
            --output test-results \
            --junitxml=test-results/junit.xml \
            -v

      # 「跑了 0 個情境」與「情境全過」在 pytest 的退出碼上是同一個 0：
      # deselect（-m 沒命中）與 skip 都不會讓 pytest 失敗。這一步把
      # 「實際執行量」本身變成斷言,讓空跑不可能被誤讀成通過。
      - name: 斷言 journey 真的跑了
        if: ${{ !cancelled() }}
        working-directory: e2e/journey
        env:
          MIN_SKELETON: '1'
          MIN_FULL: '20'
          # 窄選（pytest_expr 非空）本來就只命中一小撮情境，套 MIN_FULL=20
          # 會誤殺合法窄選;但下限不能歸零——「窄選卻一個都沒跑」仍是
          # marker 打錯字或情境全 skip 的訊號,floor=1 保住這道防線。
          MIN_FILTERED: '1'
          # 下限管不到「跑得夠多、但跑的不是目標」:2026-08-08 的 run
          # 31253115394 裡 f00 的 A0 付款失敗 → f10 建樹倒 → f20/f30/f40/
          # f45/f50/f60 全數 skip(39 條),只剩 f70 的連鎖失敗在「跑」,
          # ran=72 遠高於 20,下限完全沒感覺。full 跑正常時 skip 應趨近 0
          # (窄選與 skeleton 靠的是 deselect,不是 skip),所以 skip 佔比
          # 本身就是「上游倒了、下游根本沒驗到」的訊號。
          MAX_SKIP_RATIO_FULL: '0.1'
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          path = 'test-results/junit.xml'
          if not os.path.exists(path):
              sys.exit('::error::找不到 junit.xml —— pytest 未產出報告,視為未執行')

          root = ET.parse(path).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          total   = sum(int(s.get('tests', 0))    for s in suites)
          skipped = sum(int(s.get('skipped', 0))  for s in suites)
          ran = total - skipped
          if os.environ.get('PYTEST_EXPR'):
              floor = int(os.environ['MIN_FILTERED'])
          else:
              floor = int(os.environ['MIN_SKELETON' if os.environ['SCOPE'] == 'skeleton' else 'MIN_FULL'])

          print(f'scope={os.environ["SCOPE"]} expr={os.environ.get("PYTEST_EXPR", "")!r} '
                f'collected={total} skipped={skipped} ran={ran} floor={floor}')
          if ran < floor:
              sys.exit(
                  f'::error::journey 實際只執行 {ran} 個情境（下限 {floor}）——'
                  '視為未執行。常見原因:分支連線資訊沒帶進來導致情境全 skip,'
                  '或 marker 沒命中導致全數 deselect。'
              )

          # 「跑了很多」不等於「驗到了」:上游章節倒下時,下游情境是 skip 而非
          # fail,總量看起來照樣健康。full 才查——窄選/skeleton 少跑是靠
          # deselect,skip 佔比對它們沒有意義。
          full = not os.environ.get('PYTEST_EXPR') and os.environ['SCOPE'] != 'skeleton'
          if full and total:
              ratio = skipped / total
              limit = float(os.environ['MAX_SKIP_RATIO_FULL'])
              print(f'skip_ratio={ratio:.1%} limit={limit:.0%}')
              if ratio > limit:
                  sys.exit(
                      f'::error::journey full 有 {skipped}/{total} 個情境被 skip'
                      f'（{ratio:.0%} > {limit:.0%}）——多半是前置章節倒了讓整批'
                      '下游情境沒執行到。這一場對「被 skip 的那些情境」不具驗證'
                      '效力,別把它讀成「只剩幾條紅」。'
                  )
          print('OK:journey 確實執行了')
          PY

      - name: 上傳 journey 測試產物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-results-${{ github.run_id }}
          path: |
            e2e/journey/test-results/
            e2e/journey/.run/
          retention-days: 14
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # 4. 第一道保險：不論成敗，整個分支刪掉＝資料必然不存在
      #    （suite 內的 cleanup.py + 零殘留斷言是第二道，已在步驟 3 跑過）
      # ------------------------------------------------------------------
      - name: 刪除拋棄式分支
        if: always()
        run: |
          supabase branches delete "${{ steps.branch.outputs.name }}" --experimental --yes \
            || echo "::error::分支刪除失敗——請到 Supabase dashboard 手動刪除 ${{ steps.branch.outputs.name }}"

      # ------------------------------------------------------------------
      # 5. 失敗訊號必須有人接住：**排程** run 的失敗通知只寄給最後改
      #    workflow 的人，很容易無聲蒸發——自動開 issue 作為 triage 佇列，
      #    缺陷回流（issue → plan → 修復）才有起點。
      #
      #    ⚠️ 只在 schedule 觸發時開，理由就是上面那句：無人守候的失敗才
      #    需要一張 issue 來接住。晉升 PR 的紅燈在 PR 上、手動 dispatch 的
      #    當下有人正盯著，兩者都不需要——2026-08-07 一個上午 10 次 dispatch
      #    有 6 次失敗，若照舊就是 6 張沒人需要的 issue（原條件是
      #    `!= 'pull_request'`，把 dispatch 也算了進去）。
      #
      #    同名查重：title 刻意**不帶 runId**，否則每次失敗都是新 issue、
      #    永遠去重不掉（實測累積出 #201/#202/#203 三張同因 issue）。改為
      #    固定標題 + 更新內文指向最新一次 run，未關閉前只會有一張。
      # ------------------------------------------------------------------
      - name: 失敗時開 triage issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'journey 排程失敗';
            const body = [
              '## Journey 排程失敗',
              '',
              `- 最新一次 Run：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Triage SOP：',
              '1. 下載 run artifacts（screenshots / tracing）判讀失敗情境',
              '2. 真缺陷 → `/fix-bug`（根因＋同類掃描）；環境雜訊 → 註記後關閉',
              '3. 同因重複失敗 ≥2 次 → 記入 docs/plans/friction-log.md',
              '4. 短期修不動 → 到 Actions 頁停用 Journey Scheduled 排程，修好再開',
              '   （每場都會開一個付費的 Supabase preview branch，紅著跑不是免費的）',
              '',
              '排除後關閉此 issue；下次排程失敗會重新開一張。',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            const dup = open.data.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
              core.info(`已有未關閉的同名 issue #${dup.number}，更新為最新一次 run`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });
