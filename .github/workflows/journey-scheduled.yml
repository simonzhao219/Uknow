name: Journey Scheduled

# ============================================================================
# journey 套件的排程（每週）／手動觸發入口——**薄外殼**：只負責 triggers 與
# concurrency，所有邏輯都在 journey.yml（單一定義，晉升 PR 與這裡共用）。
#
# 為什麼 concurrency 放在這裡而不是 journey.yml：
# reusable workflow 的 workflow 層 concurrency 會參與呼叫端的排隊，一旦
# 呼叫端的 run 被 cancel-in-progress 取消，該 group 的 slot 不會乾淨釋放，
# 之後每個 run 都永遠卡在 pending 且連 job 都不會建立（PR #114 實測）。
# 保護放在這層就沒有這個問題：PR 路徑本來就由 ci.yml 的 concurrency 管，
# 這裡只需要擋住「兩場排程／手動 journey 同時開拋棄式分支」——那才是
# 真正會付兩份分支費用、且會撞 PayUni sandbox 共用狀態的情況。
# ============================================================================
on:
  schedule:
    # 台北週日 02:00 = UTC 週六 18:00，每週一次。
    # 頻率依據：真正擋上線的是晉升 PR 上的 journey-full（ci.yml，不受此檔
    # 影響），這裡只是 develop 真後端的漂移偵測，週級延遲對目前的發布節奏
    # 夠用。成本**不在 GitHub 分鐘**（repo 已轉 public，標準 runner 免費），
    # 而在每場都要開一個**拋棄式 Supabase preview branch**——Branching 是
    # 付費功能、按分支時數計；加上 PayUni sandbox 是共用狀態，所以同時
    # 最多一場（見下方 concurrency）。訊號面的佐證：2026-07-26 起曾連紅
    # 12 晚無人接手，日級頻率買不到日級價值。
    # 需要即時驗證時用下面的 workflow_dispatch（可搭 pytest_expr 窄選）。
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      scope:
        description: '範圍（skeleton=單人骨架快速驗證；full=全 30 人六模組）'
        type: choice
        options: [full, skeleton]
        default: full
      payment_mode:
        description: '付款模式（sandbox=真刷測試卡；webhook=簽章注入備援）'
        type: choice
        options: [sandbox, webhook]
        default: sandbox
      pytest_expr:
        description: '可選 pytest marker 運算式（如 timemachine、renewal_saga）——只跑命中的 feature；空值=依 scope'
        type: string
        default: ''

# 分支費用＋PayUni sandbox 共享狀態：同時最多一場
# group 帶 -v2:2026-08-07 GitHub Actions 平台故障期間(所有 workflow
# 都 3 秒零步驟 failure)一度誤診為 PR #114 的 slot 中毒而改名。事後
# 確認是平台級故障、自行恢復;group 名是任意識別字,改名無害也無益,
# 故障後已在此名稱下穩定跑過多場,維持現名即可。
concurrency:
  group: journey-scheduled-v2
  cancel-in-progress: false

jobs:
  journey-suite:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/journey.yml
    with:
      scope: ${{ inputs.scope || 'full' }}
      payment_mode: ${{ inputs.payment_mode || 'sandbox' }}
      pytest_expr: ${{ inputs.pytest_expr || '' }}
    secrets: inherit
